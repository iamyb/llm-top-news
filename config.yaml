github:
  # Search API: 近 N 天新建 + 按 star 排序（新晋 star 榜）
  lookback_days: 7
  limit: 30
  topics:
    - llm
    - llm-agents
    - ai-agents
    - generative-ai
    - rag
    - embeddings
    - llm-inference
    - mcp
    - coding-agent
    - fine-tuning

