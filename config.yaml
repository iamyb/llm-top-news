sections:
  github:
    label: GitHub
    order: 1
    sources:
      - github_trending
      - github_new
  # harness:
  #   label: Harness
  #   order: 2
  #   sources:
  #     - pi
  #     - deepseek_harness
  #     - opencode
  #     - vscode
  community:
    label: Community Pulse
    order: 2
    sources:
      - reddit
      - hn
  papers:
    label: Papers
    order: 3
    sources:
      - hf_papers
  applications:
    label: LLM Applications
    order: 4
    sources: []


github:
  # Search API: 近 N 天新建 + 按 star 排序（新晋 star 榜）
  lookback_days: 7
  limit: 30
  # 连续 GitHub Search 请求之间的等待秒数; 设为 0 可关闭
  request_delay_seconds: 6
  # Trending: 抓 github.com/trending?since=daily HTML 页（无官方 API）。
  # github.com 直连被墙, 需代理（可被环境变量 GITHUB_PROXY 覆盖, 留空则直连）
  proxy: "http://127.0.0.1:10809"
  trending_limit: 15
  topics:
    - llm
    - llm-agents
    - ai-agents
    - generative-ai
    - rag
    - embeddings
    - llm-inference
    - mcp
    - coding-agent
    - fine-tuning

# pi:
#   repo: earendil-works/pi

# deepseek_harness:
#   repo: deepseek-ai/deepseek-harness
#   include_prereleases: true

# opencode:
#   repo: anomalyco/opencode

# vscode:
#   repo: microsoft/vscode

hf_papers:
  limit: 15         # 按 upvote 取前 N

hn:
  # Firebase Top Stories 按排名取前 N 条, 不做关键词/语义过滤
  limit: 20
reddit:
  # 走 RSS 端点 (top/.rss?t=day), 无需 OAuth; 本机直连被墙, 必须配代理
  # 代理地址 = 本机 HTTP 代理（Clash 等）, 留空则跳过 Reddit 采集
  proxy: "http://127.0.0.1:10809"
  # 合并端点 r/A+B+.../top/.rss 单次请求, 返回合并池按热度排序的 top N;
  # 客户端按 per_sub_limit / min_per_sub 配额截取, 防止大 sub 淹没小 sub
  subreddits:
    - LocalLLaMA
    - LLMDevs
    - LocalLLM
    - Singularity
    - StableDiffusion
    # - MachineLearning
    # - artificial
    # - OpenAI
    # - ClaudeAI
    # - DeepSeek
    # - LangChain
    # - LlamaIndex
    # - VectorDatabase
    # - GenAI
  limit: 20          # 最终总条数（合并池按热度排序后截取）
  per_sub_limit: 5   # 每个 sub 最多条数（防大 sub 一家独家）
  min_per_sub: 2     # 每个 sub 保底条数（候选池里有才给）
