sections:
  github:
    label: GitHub
    order: 1
    sources:
      - github
  # harness:
  #   label: Harness
  #   order: 2
  #   sources:
  #     - pi
  #     - deepseek_harness
  #     - opencode
  #     - vscode
  models:
    label: Models
    order: 3
    sources: []
  applications:
    label: LLM Applications
    order: 4
    sources: []
  community:
    label: Community Pulse
    order: 5
    sources:
      - hn
      - reddit


github:
  # Search API: 近 N 天新建 + 按 star 排序（新晋 star 榜）
  lookback_days: 7
  limit: 30
  topics:
    - llm
    - llm-agents
    - ai-agents
    - generative-ai
    - rag
    - embeddings
    - llm-inference
    - mcp
    - coding-agent
    - fine-tuning

# pi:
#   repo: earendil-works/pi

# deepseek_harness:
#   repo: deepseek-ai/deepseek-harness
#   include_prereleases: true

# opencode:
#   repo: anomalyco/opencode

# vscode:
#   repo: microsoft/vscode

hn:
  # Algolia 先按关键词抓候选, 再由本地 MiniLM 排序取 Top-K
  daily_min_points: 30
  weekly_min_points: 100
  candidate_limit: 100
  semantic_filter:
    enabled: true
    model: sentence-transformers/all-MiniLM-L6-v2
    top_k: 10
    query: "News about large language models, generative AI, AI agents, RAG, MCP, embeddings, model training, inference, coding assistants, and AI developer tools."
  keywords:
    - "LLM"
    - "GPT"
    - "Claude"
    - "Gemini"
    - "Grok"
    - "AI agent"
    - "RAG"
    - "fine-tuning"
    - "large language model"
    - "diffusion"
    - "AI agents"
    - "agentic AI"
    - "coding agent"
    - "MCP"
    - "model context protocol"
    - "LLM inference"
    - "vLLM"
    - "Ollama"
    - "llama.cpp"
    - "embeddings"
    - "vector database"
    - "Claude Code"
    - "Codex"
    - "open source model"

reddit:
  # 走 RSS 端点 (top/.rss?t=day), 无需 OAuth; 本机直连被墙, 必须配代理
  # 代理地址 = 本机 HTTP 代理（Clash 等）, 留空则跳过 Reddit 采集
  proxy: "http://127.0.0.1:10809"
  # 合并端点 r/A+B+.../top/.rss 单次请求, 返回合并池按热度排序的 top N;
  # 客户端按 per_sub_limit / min_per_sub 配额截取, 防止大 sub 淹没小 sub
  subreddits:
    - LocalLLaMA
    - LLMDevs
    - LocalLLM
    # - MachineLearning
    # - artificial
    # - singularity
    # - OpenAI
    # - ClaudeAI
    # - DeepSeek
    # - LangChain
    # - LlamaIndex
    # - VectorDatabase
    # - GenAI
  limit: 20          # 最终总条数（合并池按热度排序后截取）
  per_sub_limit: 10  # 每个 sub 最多条数（防大 sub 一家独大）
  min_per_sub: 2     # 每个 sub 保底条数（候选池里有才给）
