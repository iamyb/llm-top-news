# llm-top-news 配置
# 采集参数保持在文件顶层; sources/sections 驱动站点板块和展示

sources:
  github:
    label: GitHub
    type: repository
    collector: github_search
    section: github
    color: "#2563eb"
    order: 1
  hn:
    label: Hacker News
    type: community
    collector: hn_algolia
    section: community
    color: "#d97706"
    order: 2
  reddit:
    label: Reddit
    type: community
    collector: reddit_rss
    section: community
    color: "#ea580c"
    order: 3

sections:
  github:
    label: GitHub
    order: 1
    sources:
      - github
  harness:
    label: Harness
    order: 2
    sources: []
  models:
    label: Models
    order: 3
    sources: []
  applications:
    label: LLM Applications
    order: 4
    sources: []
  community:
    label: Community Pulse
    order: 5
    sources:
      - hn
      - reddit


github:
  # Search API: 近 N 天新建 + 按 star 排序（新晋 star 榜）
  # 注意: GitHub Search 不允许 qualifier (topic:/in:) 之间用 OR,
  # 所以只取一个主 topic + 一个主关键词, 两次查询合并去重
  lookback_days: 7
  limit: 30
  primary_topic: llm        # 候选: llm, llm-agents, generative-ai, rag, chatgpt, llm-fine-tuning, vector-database
  primary_keyword: "LLM"    # 候选: "LLM", "GPT", "RAG", "AI agent", "large language model"

hn:
  # Algolia search_by_date + 标题短语精确匹配（"keyword"）
  # 日榜/周榜用不同分数阈值
  daily_min_points: 30
  weekly_min_points: 100
  keywords:
    - "LLM"
    - "GPT"
    - "Claude"
    - "Gemini"
    - "Grok"
    - "AI agent"
    - "RAG"
    - "fine-tuning"
    - "large language model"
    - "diffusion"

reddit:
  # 走 RSS 端点 (top/.rss?t=day), 无需 OAuth; 本机直连被墙, 必须配代理
  # 代理地址 = 本机 HTTP 代理（Clash 等）, 留空则跳过 Reddit 采集
  proxy: "http://127.0.0.1:10809"
  # 合并端点 r/A+B+.../top/.rss 单次请求, 返回合并池按热度排序的 top N;
  # 客户端按 per_sub_limit / min_per_sub 配额截取, 防止大 sub 淹没小 sub
  subreddits:
    - LocalLLaMA
    - LLMDevs
    - LocalLLM
    # - MachineLearning
    # - artificial
    # - singularity
    # - OpenAI
    # - ClaudeAI
    # - DeepSeek
    # - LangChain
    # - LlamaIndex
    # - VectorDatabase
    # - GenAI
  limit: 20          # 最终总条数（合并池按热度排序后截取）
  per_sub_limit: 10  # 每个 sub 最多条数（防大 sub 一家独大）
  min_per_sub: 2     # 每个 sub 保底条数（候选池里有才给）
