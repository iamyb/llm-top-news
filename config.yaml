hn:
  # Firebase Top Stories 前 100 → 时间/分数过滤 → 关键词预过滤 → MiniLM 排序取 Top-K
  daily_min_points: 30
  weekly_min_points: 100
  candidate_limit: 100
  semantic_filter:
    enabled: true
    model: sentence-transformers/all-MiniLM-L6-v2
    top_k: 10
    # 软阈值: 只有分数 >= min_score 的 Top-K 条目才入选, 宁缺毋滥
    min_score: 0.20
    query: "News about large language models, generative AI, AI agents, RAG, MCP, embeddings, model training, inference, coding assistants, and AI developer tools."
  # 关键词预过滤: 小写子串匹配 (标题+正文+URL), 命中任一即通过, 再进 MiniLM 排序
  pre_filter_keywords:
    # 模型名
    - "llm"
