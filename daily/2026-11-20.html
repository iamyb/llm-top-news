tched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-20T02:43:49+00:00", "tags": []}, {"source": "hn", "title": "Claude solves two open problems in the physics of black holes", "points": 524, "num_comments": 253, "url": "https://www.anthropic.com/research/claude-black-hole-physics", "hn_url": "https://news.ycombinator.com/item?id=50563148", "created_at": "2026-11-19T17:30:44+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T17:30:44+00:00", "tags": []}, {"source": "hn", "title": "PostgreSQL 19", "points": 328, "num_comments": 21, "url": "https://www.postgresql.org/docs/release/19.0/", "hn_url": "https://news.ycombinator.com/item?id=50569890", "created_at": "2026-11-20T03:45:45+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-20T03:45:45+00:00", "tags": []}, {"source": "hn", "title": "\"I can tell you wrote this yourself\"", "points": 346, "num_comments": 323, "url": "https://em-online.bearblog.dev/i-can-tell-you-wrote-this-yourself/", "hn_url": "https://news.ycombinator.com/item?id=50571189", "created_at": "2026-11-20T07:13:21+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-20T07:13:21+00:00", "tags": []}, {"source": "hn", "title": "Vint Cerf on why TCP/IP was never patented", "points": 149, "num_comments": 76, "url": "https://seremot.com/p/vint-cerf-on-why-tcpip-was-never", "hn_url": "https://news.ycombinator.com/item?id=50568861", "created_at": "2026-11-20T01:06:12+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-20T01:06:12+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "Jeveration: System One Models Now Generate", "summary": "System One models such as Jev return decisions through fast, parallel prediction. In this paper, we introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many valid images, yet parallel predictions must converge on a coherent ", "upvotes": 129, "num_comments": 4, "url": "https://huggingface.co/papers/2611.24738", "arxiv_id": "2611.24738", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Yuhe Liu", "Qi Li", "Shihua Zhang", "Xinchao Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Tideway: Phase-Aware Tiered Memory Management for MoE Inference on Consumer Devices", "summary": "Large language model (LLM) agents are rapidly becoming a dominant paradigm for AI applications. Recently, there is a growing demand to deploy large-scale Mixture-of-Experts (MoE) models locally on consumer PCs to balance data privacy, API costs, and inference efficiency. However, unlike datacenter servers with abundant DRAM, consumer devices are tightly constrained in both GPU VRAM and host RAM, forcing massive MoE weights to spill across VRAM, host RAM, and SSD. Under such spilling, we observe ", "upvotes": 55, "num_comments": 3, "url": "https://huggingface.co/papers/2611.14848", "arxiv_id": "2611.14848", "published_at": "2026-11-10T00:00:00.000Z", "authors": ["Yifei Wang", "Tsun-yu Yang", "Yechen Xu", "Hancheng Ye", "Qinsi Wang", "Baijun Zhou", "Tingjun Chen", "Hai \"Helen\" Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation", "summary": "Embodied intelligence aims to let robots perform complex physical tasks with human-like adaptability and reliability, which requires three complementary capabilities: history-based cognitive reasoning, precise and timely physical execution, and the composition of reasoning and execution through environmental feedback. Yet existing benchmarks either evaluate reasoning and execution within the same tasks or assess them separately without their composition, so they reveal little about whether a fai", "upvotes": 46, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26444", "arxiv_id": "2611.26444", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yuzhi Huang", "Jie Wu", "Fanding Huang", "Junchao Lin", "Weichen Zhang", "Ziyi Xiong", "Yang Li", "Zhengwei Xie"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection", "summary": "Recent advances in video generation call for reliable detection grounded in explicit forensic evidence. However, current methods primarily depend on single-pass chain-of-thought reasoning that overlooks brief or localized artifacts, or on predefined multi-agent workflows that offer limited flexibility in selecting relevant inspections. Even with adaptive investigation, optimizing the investigation policy alone does not directly improve the forensic capabilities of fixed experts. We introduce WeV", "upvotes": 46, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21373", "arxiv_id": "2611.21373", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Yipeng Du", "Yuxi Li", "Ying Zhang", "Chong Sun", "Chen Li", "Jing Lyu", "Ying Tai"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ALIVE: Making Streaming Video Models Interactive", "summary": "Streaming video LLMs can continuously observe the world, yet often handle user requests in isolation. We introduce ALIVE, an interactive streaming video model supporting proactive monitoring, streaming task coordination, and feedback-seeking interaction. We construct ALIVE-SFT-288K and ALIVE-RL-3K for two-stage training. Contrastive supervised fine-tuning teaches when and how to respond, while reinforcement learning with Behavior-Aligned Credit Assignment (BACA) combines trajectory-level and loc", "upvotes": 40, "num_comments": 4, "url": "https://huggingface.co/papers/2611.21366", "arxiv_id": "2611.21366", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jinzhao Li", "Yuan Xu", "Jinxuan Wu", "Yukun Wang", "Yijia Lei", "Hanyu Ji", "Yinuo Chen", "Zining Huang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding", "summary": "Video understanding, particularly with accompanying audio, remains a central challenge in multimodal intelligence. In this report, we introduce WeMM-Video, a family of Chinese-English bilingual omni-modal foundation models spanning 2B, 4B, 9B, and 35B-A3B variants. Centering on joint audio-visual perception and reasoning, WeMM-Video unifies text, image, audio, and video processing within a hybrid-thinking paradigm, seamlessly supporting both a non-thinking instruct mode for fast, direct response", "upvotes": 39, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26409", "arxiv_id": "2611.26409", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Changli Tang", "Jie Yang", "Tianyi Wang", "Lei Li", "Daoze Zhang", "Zijie Xin", "Zhan Liu", "Li Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "The Resolution Hypothesis: Agent Evolution's Key Is Identifying Improvements", "summary": "Agent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories) and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle: methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but because noisy evaluations cannot reliably identify them. Across", "upvotes": 36, "num_comments": 6, "url": "https://huggingface.co/papers/2611.23068", "arxiv_id": "2611.23068", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Yuanhao Zeng", "Shaocheng Lan", "Ao Lu", "Kuang Yan", "Heng Lin", "Xinang Xu", "Yuan Luo", "Yueting Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Probing the \"Conscious\" Mind: Selective Access and Global Workspace in Vision-Language Models", "summary": "Vision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to specialised processes. We introduce the Multimodal Concept Lens (MC-Lens), a multimodal Jacobian lens, to study these functions in VLM concept processing. Its vision encoder and language decoder lenses map i", "upvotes": 33, "num_comments": 1, "url": "https://huggingface.co/papers/2611.26590", "arxiv_id": "2611.26590", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Jiahao Huang", "Jun Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "The Mask Is Not the Object: Volumetric Supervision for 3D Gaussian Segmentation", "summary": "3D Gaussian Splatting enables object-level operations on Gaussian primitives, yet existing segmentation methods are largely trained and evaluated through rendered views. This mismatch can produce accurate rendered masks from incomplete 3D selections since alpha-blended feature supervision concentrates learning on dominant contributors while leaving occluded or low-contribution Gaussians weakly supervised. We propose VODA, a plug-and-play supervision objective that exploits local depth structure ", "upvotes": 30, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21383", "arxiv_id": "2611.21383", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jeonghwan Cho", "Minsu Kim", "Junyoung Hong", "Seon Joo Kim"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Coda-DaVinci: Reimagining Video Generation with Code2Video", "summary": "Code2Video uses agent-authored 3D proxies to guide video generation, enabling explicit control over structure and dynamics. However, how to construct proxies and prompts for optimal downstream quality remains underexplored, as do the capabilities and limitations of this paradigm. Through controlled experiments and blinded human evaluation, we study proxy granularity, physics simulation, and prompting. The results reveal task-dependent trade-offs: coarse proxies favor natural motion, while medium", "upvotes": 30, "num_comments": 1, "url": "https://huggingface.co/papers/2611.26595", "arxiv_id": "2611.26595", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yiyan Ji", "Qixun Wang", "Yang Shi", "Zhuoran Zhang", "Yifan Xu", "Tengfei Liu", "Yuqi Tang", "Xiaohan Zhang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development", "summary": "Games are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring missing actions. Existing datasets also cover a limited range of games, often without explicit tasks or verifiable outcomes. To address these gaps, we introduce Game2Player, a framework that co-develops game environments and players to collect diverse and verifiable gameplay experience at s", "upvotes": 27, "num_comments": 4, "url": "https://huggingface.co/papers/2611.24154", "arxiv_id": "2611.24154", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Xirui Jiang", "Yuxi Chen", "Rui Yang", "Feng Luo", "Pengcheng Wang", "Bingxuan Li", "Zihao Zhao", "Yushan Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "PROLA: Principal-Ort
