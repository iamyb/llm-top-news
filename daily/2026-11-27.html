ory_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-26T17:47:45+00:00", "tags": []}, {"source": "hn", "title": "Hard Drive pricing has gotten bad", "points": 504, "num_comments": 435, "url": "https://blog.ktz.me/black-friday-hard-drive-prices-are-messed-up/", "hn_url": "https://news.ycombinator.com/item?id=50661646", "created_at": "2026-11-27T01:13:49+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T01:13:49+00:00", "tags": []}, {"source": "hn", "title": "Show HN: I restored Palm's last device, and brought its OS to other platforms", "points": 11, "num_comments": 0, "url": "https://www.webosarchive.org/pivot/2026/11/27/the-story-so-far/", "hn_url": "https://news.ycombinator.com/item?id=50667452", "created_at": "2026-11-27T14:37:02+00:00", "story_text": "webOS Community Edition 3.2.0 is the first OTA Update for Palm&#x2F;HP&#x27;s TouchPad, modernizing a 15-year old device. Lunacy is its sibling: the webOS experience, and apps, on Android. Luna DE is a developer tool that brings the webOS app contract to Mac, Windows and Linux as a SDK-compatible Electron app.", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T14:37:02+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "Stable Gated DeltaNet-2: Understanding and Mitigating Recurrent State Instability", "summary": "Linear attention offers an efficient solution for long-sequence modeling via linear complexity and fixed-size recurrent states. Gated DeltaNet-2 (GDN-2) introduces independent channel-wise control over erasure and writing, enhancing state-update expressiveness and in-context retrieval, yet it suffers from training failures during long-context training. We trace these failures to the asymmetry between reading and modification directions during erasure, which yields non-normal erase operators whos", "upvotes": 126, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34051", "arxiv_id": "2611.34051", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Xichong Zhang", "Xixuan Hao", "Zhichen Liu", "Le Zhou", "Zeyu Zhang", "Boyu Chen", "Mingfei Lu", "Zehao Lin"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "OS-Omni: Benchmarking Generalist Computer-Using Agents on Long-Horizon Workflows Across Platforms", "summary": "Computer-using agents are increasingly expected to complete realistic user goals rather than isolated GUI actions. However, existing benchmarks typically isolate web, mobile, or desktop environments, leaving it unclear whether a single generalist agent can execute long-horizon workflows that span multiple operating systems and persistent application states. We introduce OS-Omni, a live cross-platform benchmark and execution environment for evaluating computer-using agents across Windows, Ubuntu,", "upvotes": 99, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34232", "arxiv_id": "2611.34232", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Hui Shen", "Yunta Hsieh", "Jianing Ma", "Zhuoran Yin", "Zhuhan Bao", "Ziyuan Liu", "Qi Han", "Xiuqi Xu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Sage-Med: Scaling Medical Multimodal Intelligence", "summary": "Establishing effective scaling laws for medical multimodal large language models (MLLMs) remains a persistent and fundamental challenge. Our systematic evaluation shows that existing medical MLLMs tend to underperform frontier general-purpose MLLMs across a range of medical tasks, while scaling model size primarily improves text capabilities rather than multimodal perception, and enabling reasoning modes fails to close this visual gap. To investigate how medical multimodal intelligence scales in", "upvotes": 81, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34575", "arxiv_id": "2611.34575", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Med Team", "Ming Hu", "Cheng Tang", "Wei Li", "Rongbin Li", "Feilong Tang", "Junru Hu", "Hongze Zhu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Mixture-of-Loops Transformer", "summary": "Looped Transformers boost expressivity by reusing shared layers across loops, yet at the cost of efficiency. Pushing their expressivity-efficiency frontier requires rethinking the core mechanism connecting adjacent loops: What should be passed as a Transformer loops? We introduce Mixture-of-Loops Transformer (MoLT), whose Mixture-of-Loops Attention (MoLA) uses keys and values (KV) as memory for selective reuse across depths and loops. Under loop residual, MoLT-R retains the residual stream and r", "upvotes": 73, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34923", "arxiv_id": "2611.34923", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Lianghui Zhu", "Shijie Wang", "Xinggang Wang", "Jinze Bai", "Bo Wang", "Xiang Bai"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "What a Forecasting Leaderboard Can Establish: Resolution Reporting for Zero-Shot Time-Series Models", "summary": "A foundation model for time series is pretrained once and then asked to forecast series it has never seen, so the evidence for it is its score on held-out datasets. Such datasets are scarce, and a few public leaderboards carry most comparisons, yet none of them states how small a difference its datasets can detect. We call that quantity the resolution of a board and introduce Vernier, a tool that computes it from the files a board already publishes. Vernier also reports which entries a board can", "upvotes": 57, "num_comments": 4, "url": "https://huggingface.co/papers/2611.31619", "arxiv_id": "2611.31619", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Arya Sikder", "Sriram Pillutla"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "VibeVideoAgent: Closing the Perceptual Loop for Code-Driven Video Generation", "summary": "Code-driven video generation asks a coding agent to write and run rendering programs. This gives exact control over typography, data visualizations, synchronized audio, and multi-shot scenes, and it leaves an editable project behind. A program that exits cleanly can still render overlapping labels, a camera aimed away from its subject, broken object interactions, or narration that drifts out of sync, and none of these raise a runtime error. Feeding rendered frames and audio back into the coding ", "upvotes": 57, "num_comments": 5, "url": "https://huggingface.co/papers/2611.34237", "arxiv_id": "2611.34237", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Xuanyu Zheng", "Luoyuan Zhang", "Yancheng Long", "Haoyang Xu", "Muxi Diao", "Yuzhe Chen", "Kaiyu Jiang", "Bin Wen"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation", "summary": "Visual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while structured artifacts use explicit programs. A shared generation-and-rendering interface connects these representations to visual feedback across images, vector graphics, webpages, and documents. A Nemot", "upvotes": 55, "num_comments": 3, "url": "https://huggingface.co/papers/2611.31358", "arxiv_id": "2611.31358", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Guo Chen", "Fuxiao Liu", "Haoqin Tu", "Yiyang Zhou", "Andrew Tao", "Bryan Catanzaro", "Cihang Xie", "Yuyin Zhou"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "DyLoMo-DiT: Dynamic Looped Mixture-of-Experts Diffusion Transformers", "summary": "Diffusion Transformers (DiTs) scale model capacity by increasing both parameter count and computati "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Solve Vision with Code: Coding Agents Are Stronger Visual Reasoners Than Video Models", "summary": "Video generation models are increasingly evaluated as visual reasoners: given a first frame and a natural-language prompt, can the model produce the video in which the specified task is carried out? The paradigm is considered advantageous because the reasoning is native to the visual medium, unfolding directly in the frames rather than through language or code. Whether this native route is in fact the more reliable path to visual reasoning has not been tested against a symbolic alternative under", "upvotes": 38, "num_comments": 4, "url": "https://huggingface.co/papers/2611.34813", "arxiv_id": "2611.34813", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Dezhi Luo", "Fengyuan Yu", "Haotian Zhang", "Zehong Zhao", "Ran Ji", "Siyuan An", "Huayi Qin", "Qingying Gao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ProxyGenBench: Benchmarking Proxy-Guided Video Generation", "summary": "Recent video generators produce realistic videos, yet controlling how scenes unfold remains challenging. Structural proxies, such as animated 3D blockouts, guide generation by specifying scene layout, motion, camera behavior, and event order. However, these coarse inputs leave details unspecified and may contain artifacts that should not be reproduced. Successful proxy-guided generation must therefore Preserve intended structure, Complete missing content and correct proxy artifacts, and Bind tex", "upvotes": 36, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34457", "arxiv_id": "2611.34457", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Zhenchen Tang", "Haolin Lu", "Songlin Yang", "Xiaotong Zhao", "Ran Zhang", "Bo Peng", "Shuai Li", "Haotian Fan"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Entangle: Scaling Human-Video In-Context World-Action Mo
