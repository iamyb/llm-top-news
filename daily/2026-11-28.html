 "created_at": "2026-11-28T02:03:25+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-28T02:03:25+00:00", "tags": []}, {"source": "hn", "title": "9/UX: a Macintosh-inspired desktop for 9front", "points": 94, "num_comments": 24, "url": "https://progrium.github.io/9ux/", "hn_url": "https://news.ycombinator.com/item?id=50672008", "created_at": "2026-11-27T21:48:14+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T21:48:14+00:00", "tags": []}, {"source": "hn", "title": "Show HN: bouncemarket – a live prediction market game for a bouncing ball", "points": 344, "num_comments": 116, "url": "https://bouncemarket.minhanhday.com/", "hn_url": "https://news.ycombinator.com/item?id=50667726", "created_at": "2026-11-27T15:01:50+00:00", "story_text": "a ball will fall. trade on where it lands.<p>I made this game! Some technical details:<p>The entire drop of the ball is simulated server-side, then streamed to each client as server-sent events with a small buffer. Every drop is deterministic from its starting position, so rounds can be replayed exactly for later analysis, but tiny variations in starting position can change the ultimate outcome.<p>There&#x27;s some AI traders to keep the market moving, but they drop out in any round that has more than five people. They operate using a naive set of rules that I wrote for them, so they&#x27;re not too hard to beat -- it&#x27;s when the market is full of real people that it gets tricky.<p>Curious to get feedback on anything you would change, and especially whether the mechanics were clear right away or not.", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T15:01:50+00:00", "tags": []}, {"source": "hn", "title": "Tabernetes: A Kubernetes cluster whose nodes are browser tabs", "points": 61, "num_comments": 27, "url": "https://tabernet.es/", "hn_url": "https://news.yco d_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T20:23:14+00:00", "tags": []}, {"source": "hn", "title": "Michael Nielsen took down his book on neural nets", "points": 451, "num_comments": 284, "url": "https://neuralnetworksanddeeplearning.com/", "hn_url": "https://news.ycombinator.com/item?id=50670757", "created_at": "2026-11-27T19:31:01+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T19:31:01+00:00", "tags": []}, {"source": "hn", "title": "False computer-checked proofs", "points": 200, "num_comments": 79, "url": "https://cr.yp.to/proofs/falseccp.html", "hn_url": "https://news.ycombinator.com/item?id=50667989", "created_at": "2026-11-27T15:26:09+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T15:26:09+00:00", "tags": []}, {"source": "hn", "title": "Show HN: DragDropMath – Learn math by feel", "points": 117, "num_comments": 33, "url": "https://dragdropmath.com/", "hn_url": "https://news.ycombinator.com/item?id=50669673", "created_at": "2026-11-27T17:56:28+00:00", "story_text": "Hi HN!<p>I am a professional physicist and I shuffle symbols in equations and mathematical expressions all day long. During my PhD (almost 20 years ago) I noticed that it is as if the symbols have their own &#x27;physics&#x27;, which makes the wrong moves impossible and the right ones obvious.<p>So I created DragDropMath, where you can learn how to simplify mathematical expressions and how to solve equations by dragging symbols around, and only correct moves are allowed, so you get to feel what&#x27;s right without experiencing (and so learning) wrong moves.<p>I always wanted to make this, but life got in the way. Then a few weeks ago I saw declarative dragging (<a href=\"https:&#x2F;&#x2F;declarative-dragging.github.io&#x2F;\" rel=\"nofollow\">https:&#x2F;&#x2F;declarative-dragging.github.io&#x2F;<\/a>) on the front page of HN and the spark came back!<p>It took quite a few rounds to get the feel right, but I think it&#x27;s close to what happens in my mind when I mentally manipulate these expressions.<p>A few more points:\n- There are no ads, no trackers, no accounts (it&#x27;s a static website and progress is saved in the browser cache).\n- Teachers can create their own problem sets, encoded in the link.\n- I plan to add more chapters (trigonometry, complex numbers, some calculus) but I first need to figure out the &#x27;right&#x27; mode of interaction.\n- I just started working on the experience from mobile, so there may still be some rough edges there<p>I&#x27;m curious to know what you think, if you have suggestions for content, if you spot anything that I should fix, if you have feature requests! Thank you in advance", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T17:56:28+00:00", "tags": []}, {"source": "hn", "title": "Woman evicted after landlord's AI assistant told her she could delay rent", "points": 119, "num_comments": 92, "url": "https://drmahfouz.substack.com/p/woman-evicted-after-landlords-ai", "hn_url": "https://news.ycombinator.com/item?id=50673521", "created_at": "2026-11-28T01:32:56+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-28T01:32:56+00:00", "tags": []}, {"source": "hn", "title": "SessionGraph: Visualize all your coding agent sessions in one interactive graph", "points": 39, "num_comments": 19, "url": "https://sessiongraph.ai/", "hn_url": "https://news.ycombinator.com/item?id=50671651", "created_at": "2026-11-27T21:07:34+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T21:07:34+00:00", "tags": []}, {"source": "hn", "title": "Source Control from Hell", "points": 77, "num_comments": 59, "url": "https://frantic.im/git/", "hn_url": "https://news.ycombinator.com/item?id=50672142", "created_at": "2026-11-27T22:06:44+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T22:06:44+00:00", "tags": []}, {"source": "hn", "title": "Making a 3D fantasy map like a 16th-Century atlas", "points": 108, "num_comments": 14, "url": "https://www.spritefusion.com/blog/making-a-fantasy-map-like-a-16th-century-atlas", "hn_url": "https://news.ycombinator.com/item?id=50667062", "created_at": "2026-11-27T14:02:52+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T14:02:52+00:00", "tags": []}, {"source": "hn", "title": "Quad9 Blocks Nginx2root.com", "points": 21, "num_comments": 15, "url": "https://quad9.net/?url=nginx2root.com#domain-tester", "hn_url": "https://news.ycombinator.com/item?id=50671619", "created_at": "2026-11-27T21:03:56+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T21:03:56+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "Stable Gated DeltaNet-2: Understanding and Mitigating Recurrent State Instability", "summary": "Linear attention offers an efficient solution for long-sequence modeling via linear complexity and fixed-size recurrent states. Gated DeltaNet-2 (GDN-2) introduces independent channel-wise control over erasure and writing, enhancing state-update expressiveness and in-context retrieval, yet it suffers from training failures during long-context training. We trace these failures to the asymmetry between reading and modification directions during erasure, which yields non-normal erase operators whos", "upvotes": 128, "num_comments": 3, "url": "https://huggingface.co/papers/2611.34051", "arxiv_id": "2611.34051", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Xichong Zhang", "Xixuan Hao", "Zhichen Liu", "Le Zhou", "Zeyu Zhang", "Boyu Chen", "Mingfei Lu", "Zehao Lin"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "OS-Omni: Benchmarking Generalist Computer-Using Agents on Long-Horizon Workflows Across Platforms", "summary": "Computer-using agents are increasingly expected to complete realistic user goals rather than isolated GUI actions. However, existing benchmarks typically isolate web, mobile, or desktop environments, leaving it unclear whether a single generalist agent can execute long-horizon workflows that span multiple operating systems and persistent application states. We introduce OS-Omni, a live cross-platform benchmark and execution environment for evaluating computer-using agents across Windows, Ubuntu,", "upvotes": 104, "num_comments": 3, "url": "https://huggingface.co/papers/2611.34232", "arxiv_id": "2611.34232", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Hui Shen", "Yunta Hsieh", "Jianing Ma", "Zhuoran Yin", "Zhuhan Bao", "Ziyuan Liu", "Qi Han", "Xiuqi Xu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Sage-Med: Scaling Medical Multimodal Intelligence", "summary": "Establishing effective scaling laws for medical multimodal large language models (MLLMs) remains a persistent and fundamental challenge. Our systematic evaluation shows that existing medical MLLMs tend to underperform frontier general-purpose MLLMs across a range of medical tasks, while scaling model size primarily improves text capabilities rather than multimodal perception, and enabling reasoning modes fails to close this visual gap. To investigate how medical multimodal intelligence scales in", "upvotes": 82, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34575", "arxiv_id": "2611.34575", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Med Team", "Ming Hu", "Cheng Tang", "Wei Li", "Rongbin Li", "Feilong Tang", "Junru Hu", "Hongze Zhu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Mixture-of-Loops Transformer", "summary": "Looped Transformers boost expressivity by reusing shared layers across loops, yet at the cost of efficiency. Pushing their expressivity-efficiency frontier requires rethinking the core mechanism connecting adjacent loops: What should be passed as a Transformer loops? We introduce Mixture-of-Loops Transformer (MoLT), whose Mixture-of-Loops Attention (MoLA) uses keys and values (KV) as memory for selective reuse across depths and loops. Under loop residual, MoLT-R retains the residual stream and r", "upvotes": 74, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34923", "arxiv_id": "2611.34923", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Lianghui Zhu", "Shijie Wang", "Xinggang Wang", "Jinze Bai", "Bo Wang", "Xiang Bai"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "DyLoMo-DiT: Dynamic Looped Mixture-of-Experts Diffusion Transformers", "summary": "Diffusion Transformers (DiTs) scale model capacity by increasing both parameter count and computation. Mixture-of-Experts (MoE) variants expand parameter capacity while keeping per-token computation roughly fixed, but still require substantial parameter storage. In this paper, we propose Dynamic Looped MoE DiT (DyLoMo-DiT), which reuses parameters rather than adding them: a weight-shared loop repeatedly applies the middle layers, while sparse experts allocate parameter capacity across tokens. Th", "upvotes": 73, "num_comments": 5, "url": "https://huggingface.co/papers/2611.30844", "arxiv_id": "2611.30844", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Lernie Li", "Yuanliu Liu", "Pengfei Xiong", "Wei Zhang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Solve Vision with Code: Coding Agents Are Stronger Visual Reasoners Than Video Models", "summary": "Video generation models are increasingly evaluated as visual reasoners: given a first frame and a natural-language prompt, can the model produce the video in which the specified task is carried out? The paradigm is considered advantageous because the reasoning is native to the visual medium, unfolding directly in the frames rather than through language or code. Whether this native route is in fact the more reliable path to visual reasoning has not been tested against a symbolic alternative under", "upvotes": 60, "num_comments": 5, "url": "https://huggingface.co/papers/2611.34813", "arxiv_id": "2611.34813", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Dezhi Luo", "Fengyuan Yu", "Haotian Zhang", "Zehong Zhao", "Ran Ji", "Siyuan An", "Huayi Qin", "Qingying Gao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "What a Forecasting Leaderboard Can Establish: Resolution Reporting for Zero-Shot Time-Series Models", "summary": "A foundation model for time series is pretrained once and then asked to forecast series it has never seen, so the evidence for it is its score on held-out datasets. Such datasets are scarce, and a few public leaderboards carry most comparisons, yet none of them states how small a difference its datasets can detect. We call that quantity the resolution of a board and introduce Vernier, a tool that computes it from the files a board already publishes. Vernier also reports which entries a board can", "upvotes": 58, "num_comments": 5, "url": "https://huggingface.co/papers/2611.31619", "arxiv_id": "2611.31619", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Arya Sikder", "Sriram Pillutla"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "VibeVideoAgent: Closing the Perceptual Loop for Code-Driven Video Generation", "summary": "Code-driven video generation asks a coding agent to write and run rendering programs. This gives exact control over typography, data visualizations, synchronized audio, and multi-shot scenes, and it leaves an editable project behind. A program that exits cleanly can still render overlapping labels, a camera aimed away from its subject, broken object interactions, or narration that drifts out of sync, and none of these raise a runtime error. Feeding rendered frames and audio back into the coding ", "upvotes": 58, "num_comments": 5, "url": "https://huggingface.co/papers/2611.34237", "arxiv_id": "2611.34237", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Xuanyu Zheng", "Luoyuan Zhang", "Yancheng Long", "Haoyang Xu", "Muxi Diao", "Yuzhe Chen", "Kaiyu Jiang", "Bin Wen"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation", "summary": "Visual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while structured artifacts use explicit programs. A shared generation-and-rendering interface connects these representations to visual feedback across images, vector graphics, webpages, and documents. A Nemot", "upvotes": 55, "num_comments": 3, "url": "https://huggingface.co/papers/2611.31358", "arxiv_id": "2611.31358", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Guo Chen", "Fuxiao Liu", "Haoqin Tu", "Yiyang Zhou", "Andrew Tao", "Bryan Catanzaro", "Cihang Xie", "Yuyin Zhou"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Improving and Expanding Video Editing Capabilities Without Videos", "summary": "Image editing models can follow a wide range of instructions, but video editing models still lag behind, limited in part by the difficulty of collecting paired source and edited videos. Is it possible to transfer advanced image editing capabilities to video editors without new paired videos? We introduce Image-to-Video Transfer (I2VT), which improves pretrained video editors and expands them to new editing tasks using an image editor. It enables efficient post-training with no architectural chan", "upvotes": 46, "num_comments": 3, "url": "https://huggingface.co/papers/2611.34941", "arxiv_id": "2611.34941", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Ji Xie", "Yanhao Jia", "Xiangpeng Yang", "Martin Q. Ma", "Sihan Xu", "Erik Cambria", "Louis-Philippe Morency"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "PyRUA-Dex: Learning Programmatic Policies for Dexterous Bimanual Manipulation with Coding Agents", "summary": "Learning for dexterous manipulation is limited by the scarcity of high-quality demonstrations: retargeting from human video is imprecise, teleoperation gives no force feedback to the operator, and exoskeleton-based collection is hard to scale up. We present PyRUA-Dex, a framework that enables coding agents to develop dexterous manipulation through programmatic policy, without the need of demonstrations. The programmatic policy is developed in two stages: during exploration, multiple agents explo", "upvotes": 43, "num_comments": 3, "url": "https://huggingface.co/papers/2611.33144", "arxiv_id": "2611.33144", "published_at": "2026-11-24T00:00:00.000Z", "authors": ["Feixiang Ruan", "Guodong Lv", "Kewei Zhang", "Wenbo Huang", "Yintianrun Zhang", "Qiang Wang", "Ruiyang Si", "Shunyu Yang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ProxyGenBench: Benchmarking Proxy-Guided Video Generation", "summary": "Recent video generators produce realistic videos, yet controlling how scenes unfold remains challenging. Structural proxies, such as animated 3D blockouts, guide generation by specifying scene layout, motion, camera behavior, and event order. However, these coarse inputs leave details unspecified and may contain artifacts that should not be reproduced. Successful proxy-guided generation must therefore Preserve intended structure, Complete missing content and correct proxy artifacts, and Bind tex", "upvotes": 36, "num_comments": 3, "url": "https://huggingface.co/papers/2611.34457", "arxiv_id": "2611.34457", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Zhenchen Tang", "Haolin Lu", "Songlin Yang", "Xiaotong Zhao", "Ran Zhang", "Bo Peng", "Shuai Li", "Haotian Fan"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Entangle: Scaling Human-Video In-Context World-Action Models across Unseen Tasks and Contexts", "summary": "In-context learning (ICL) enables foundation models to perform unseen tasks from context without parameter updates. In robotic manipulation, a human video provides the context that specifies how a task should be performed. However, scaling human-video ICL on world-action models (WAMs) faces two challenges: task-level human-robot pairs are not temporally aligned with robot actions, and standard action losses allow policies to rely on initial-scene or task-identity shortcuts rather than tracking t", "upvotes": 34, "num_comments": 3, "url": "https://huggingface.co/papers/2611.28732", "arxiv_id": "2611.28732", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Chendong Xiang", "Chengwen Zhang", "Ruowen Zhao", "Zeyuan Wang", "Shuhe Huang", "Rongxu Cui", "Min Zhao", "Fan Bao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "DocSEAM: Bidirectional Cross-Page Encoding for Multi-Page Document Understanding", "summary": "Multi-page document vision-language models encode each page independently, creating a feature-level discontinuity at page boundaries: visual tokens are formed without access to content on adjacent pages, and the language model must reason over these page representations formed in isolation. We introduce DocSEAM (Document Selective Enrichment via Anchored Masking), a lightweight module inserted between a pretrained vision encoder and the language model that injects the inductive bias of local cro", "upvotes": 28, "num_comments": 4, "url": "https://huggingface.co/papers/2611.34420", "arxiv_id": "2611.34420", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Hoang-Nhat Nguyen", "Chen Change Loy"], "section": "papers", "tags": []}, {"source": "hf_p , "created_at": "2026-11-27T15:01:50+00:00", "story_text": "a ball will fall. trade on where it lands.<p>I made this game! Some technical details:<p>The entire drop of the ball is simulated server-side, then streamed to each client as server-sent events with a small buffer. Every drop is deterministic from its starting position, so rounds can be replayed exactly for later analysis, but tiny variations in starting position can change the ultimate outcome.<p>There&#x27;s some AI traders to keep the market moving, but they drop out in any round that has more than five people. They operate using a naive set of rules that I wrote for them, so they&#x27;re not too hard to beat -- it&#x27;s when the market is full of real people that it gets tricky.<p>Curious to get feedback on anything you would change, and especially whether the mechanics were clear right away or not.", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T15:01:50+00:00", "tags": []}, {"source": "hn", "title": "Tabernetes: A Kubernetes cluster whose nodes are browser tabs", "points": 61, "num_comments": 27, "url": "https://tabernet.es/", "hn_url": "https://news.ycombinator.com/item?id=50672521", "created_at": "2026-11-27T23:00:30+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T23:00:30+00:00", "tags": []}, {"source": "hn", "title": "The AT&T Unix PC (3B1) VM", "points": 73, "num_comments": 13, "url": "https://virtuallyfun.com/2026/11/22/the-ultimate-att-unix-pc-3b1-vm-w-tcp-ip-and-apps/", "hn_url": "https://news.ycombinator.com/item?id=50670841", "created_at": "2026-11-27T19:40:33+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T19:40:33+00:00", "tags": []}, {"source": "hn", "title": "Rayshader 1.0: Exit the Matrix", "points": 98, "num_comments": 13, "url": "https://www.tylermw.com/posts/rayverse/rayshader-1-0-exit-the-matrix.html", : "community", "summary": "", "published_at": "2026-11-27T15:26:09+00:00", "tags": []}, {"source": "hn", "title": "Show HN: DragDropMath – Learn math by feel", "points": 117, "num_comments": 33, "url": "https://dragdropmath.com/", "hn_url": "https://news.ycombinator.com/item?id=50669673", "created_at": "2026-11-27T17:56:28+00:00", "story_text": "Hi HN!<p>I am a professional physicist and I shuffle symbols in equations and mathematical expressions all day long. During my PhD (almost 20 years ago) I noticed that it is as if the symbols have their own &#x27;physics&#x27;, which makes the wrong moves impossible and the right ones obvious.<p>So I created DragDropMath, where you can learn how to simplify mathematical expressions and how to solve equations by dragging symbols around, and only correct moves are allowed, so you get to feel what&#x27;s right without experiencing (and so learning) wrong moves.<p>I always wanted to make this, but life got in the way. Then a few weeks ago I saw declarative dragging (<a href=\"https:&#x2F;&#x2F;declarative-dragging.github.io&#x2F;\" rel=\"nofollow\">https:&#x2F;&#x2F;declarative-dragging.github.io&#x2F;<\/a>) on the front page of HN and the spark came back!<p>It took quite a few rounds to get the feel right, but I think it&#x27;s close to what happens in my mind when I mentally manipulate these expressions.<p>A few more points:\n- There are no ads, no trackers, no accounts (it&#x27;s a static website and progress is saved in the browser cache).\n- Teachers can create their own problem sets, encoded in the link.\n- I plan to add more chapters (trigonometry, complex numbers, some calculus) but I first need to figure out the &#x27;right&#x27; mode of interaction.\n- I just started working on the experience from mobile, so there may still be some rough edges there<p>I&#x27;m curious to know what you think, if you have suggestions for content, if you spot anything that I should fix, if you have feature requests! Thank you in advance", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T17:56:28+00:00", "tags": []}, {"source": "hn", "title": "Woman evicted after landlord's AI assistant told her she could delay rent", "points": 119, "num_comments": 92, "url": "https://drmahfouz.substack.com/p/woman-evicted-after-landlords-ai", "hn_url": "https://news.ycombinator.com/item?id=50673521", "created_at": "2026-11-28T01:32:56+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-28T01:32:56+00:00", "tags": []}, {"source": "hn", "title": "SessionGraph: Visualize all your coding agent sessions in one interactive graph", "points": 39, "num_comments": 19, "url": "https://sessiongraph.ai/", "hn_url": "https://news.ycombinator.com/item?id=50671651", "created_at": "2026-11-27T21:07:34+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T21:07:34+00:00", "tags": []}, {"source": "hn", "title": "Source Control from Hell", "points": 77, "num_comments": 59, "url": "https://frantic.im/git/", "hn_url": "https://news.ycombinator.com/item?id=50672142", "created_at": "2026-11-27T22:06:44+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T22:06:44+00:00", "tags": []}, {"source": "hn", "title": "Making a 3D fantasy map like a 16th-Century atlas", "points": 108, "num_comments": 14, "url": "https://www.spritefusion.com/blog/making-a-fantasy-map-like-a-16th-century-atlas", "hn_url": "https://news.ycombinator.com/item?id=50667062", "created_at": "2026-11-27T14:02:52+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-27T14:02:52+00:00", "tags": []}, {"source": "hn", "title": "Quad9 Blocks Nginx2root.com", "points": 21, "num_comments": 15, "url": "https://quad9.net/?url=nginx2root.com#domain-tester", "hn_url": "https://news.ycombinator.com/it
