blished_at": "2026-11-20T16:29:06+00:00", "tags": []}, {"source": "hn", "title": "FBI reportedly investigating apparent hack of its criminal database", "points": 105, "num_comments": 47, "url": "https://www.bbc.com/news/articles/cvze7de86pk3o", "hn_url": "https://news.ycombinator.com/item?id=50587859", "created_at": "2026-11-21T10:33:57+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-21T10:33:57+00:00", "tags": []}, {"source": "hn", "title": "Sir Brian May adds new dimension to Hera asteroid", "points": 133, "num_comments": 31, "url": "https://www.esa.int/articles/about-us/directorates/operations/space-safety/hera/sir-brian-may-adds-new-dimension-to-hera-asteroid", "hn_url": "https://news.ycombinator.com/item?id=50583768", "created_at": "2026-11-20T23:19:44+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-20T23:19:44+00:00", "tags": []}, {"source": "hn", "title": "DreamCoder: Coding harness and IDE from the author of Mastering Emacs", "points": 252, "num_comments": 102, "url": "https://www.masteringemacs.org/article/announcing-dreamcoder", "hn_url": "https://news.ycombinator.com/item?id=50581110", "created_at": "2026-11-20T20:03:59+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-20T20:03:59+00:00", "tags": []}, {"source": "hn", "title": "Serious cyberattack thought backed by wealthy operators", "points": 124, "num_comments": 64, "url": "https://www.ruv.is/english/2026-11-20-serious-cyberattack-thought-backed-by-wealthy-operators-493411", "hn_url": "https://news.ycombinator.com/item?id=50583856", "created_at": "2026-11-20T23:29:30+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-20T23:29:30+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "Jeveration: System One Models Now Generate", "summary": "System One models such as Jev return decisions through fast, parallel prediction. In this paper, we introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many valid images, yet parallel predictions must converge on a coherent ", "upvotes": 148, "num_comments": 4, "url": "https://huggingface.co/papers/2611.24738", "arxiv_id": "2611.24738", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Yuhe Liu", "Qi Li", "Shihua Zhang", "Xinchao Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Tideway: Phase-Aware Tiered Memory Management for MoE Inference on Consumer Devices", "summary": "Large language model (LLM) agents are rapidly becoming a dominant paradigm for AI applications. Recently, there is a growing demand to deploy large-scale Mixture-of-Experts (MoE) models locally on consumer PCs to balance data privacy, API costs, and inference efficiency. However, unlike datacenter servers with abundant DRAM, consumer devices are tightly constrained in both GPU VRAM and host RAM, forcing massive MoE weights to spill across VRAM, host RAM, and SSD. Under such spilling, we observe ", "upvotes": 67, "num_comments": 3, "url": "https://huggingface.co/papers/2611.14848", "arxiv_id": "2611.14848", "published_at": "2026-11-10T00:00:00.000Z", "authors": ["Yifei Wang", "Tsun-yu Yang", "Yechen Xu", "Hancheng Ye", "Qinsi Wang", "Baijun Zhou", "Tingjun Chen", "Hai \"Helen\" Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection", "summary": "Recent advances in video generation call for reliable detection grounded in explicit forensic evidence. However, current methods primarily depend on single-pass chain-of-thought reasoning that overlooks brief or localized artifacts, or on predefined multi-agent workflows that offer limited flexibility in selecting relevant inspections. Even with adaptive investigation, optimizing the investigation policy alone does not directly improve the forensic capabilities of fixed experts. We introduce WeV", "upvotes": 52, "num_comments": 3, "url": "https://huggingface.co/papers/2611.21373", "arxiv_id": "2611.21373", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Yipeng Du", "Yuxi Li", "Ying Zhang", "Chong Sun", "Chen Li", "Jing Lyu", "Ying Tai"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation", "summary": "Embodied intelligence aims to let robots perform complex physical tasks with human-like adaptability and reliability, which requires three complementary capabilities: history-based cognitive reasoning, precise and timely physical execution, and the composition of reasoning and execution through environmental feedback. Yet existing benchmarks either evaluate reasoning and execution within the same tasks or assess them separately without their composition, so they reveal little about whether a fai", "upvotes": 50, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26444", "arxiv_id": "2611.26444", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yuzhi Huang", "Jie Wu", "Fanding Huang", "Junchao Lin", "Weichen Zhang", "Ziyi Xiong", "Yang Li", "Zhengwei Xie"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Probing the \"Conscious\" Mind: Selective Access and Global Workspace in Vision-Language Models", "summary": "Vision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to specialised processes. We introduce the Multimodal Concept Lens (MC-Lens), a multimodal Jacobian lens, to study these functions in VLM concept processing. Its vision encoder and language decoder lenses map i", "upvotes": 41, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26590", "arxiv_id": "2611.26590", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Jiahao Huang", "Jun Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding", "summary": "Video understanding, particularly with accompanying audio, remains a central challenge in multimodal intelligence. In this report, we introduce WeMM-Video, a family of Chinese-English bilingual omni-modal foundation models spanning 2B, 4B, 9B, and 35B-A3B variants. Centering on joint audio-visual perception and reasoning, WeMM-Video unifies text, image, audio, and video processing within a hybrid-thinking paradigm, seamlessly supporting both a non-thinking instruct mode for fast, direct response", "upvotes": 41, "num_comments": 3, "url": "https://huggingface.co/papers/2611.26409", "arxiv_id": "2611.26409", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Changli Tang", "Jie Yang", "Tianyi Wang", "Lei Li", "Daoze Zhang", "Zijie Xin", "Zhan Liu", "Li Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ALIVE: Making Streaming Video Models Interactive", "summary": "Streaming video LLMs can continuously observe the world, yet often handle user requests in isolation. We introduce ALIVE, an interactive streaming video model supporting proactive monitoring, streaming task coordination, and feedback-seeking interaction. We construct ALIVE-SFT-288K and ALIVE-RL-3K for two-stage training. Contrastive supervised fine-tuning teaches when and how to respond, while reinforcement learning with Behavior-Aligned Credit Assignment (BACA) combines trajectory-level and loc", "upvotes": 40, "num_comments": 4, "url": "https://huggingface.co/papers/2611.21366", "arxiv_id": "2611.21366", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jinzhao Li", "Yuan Xu", "Jinxuan Wu", "Yukun Wang", "Yijia Lei", "Hanyu Ji", "Yinuo Chen", "Zining Huang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "The Resolution Hypothesis: Agent Evolution's Key Is Identifying Improvements", "summary": "Agent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories) and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle: methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but because noisy evaluations cannot reliably identify them. Across", "upvotes": 39, "num_comments": 8, "url": "https://huggingface.co/papers/2611.23068", "arxiv_id": "2611.23068", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Yuanhao Zeng", "Shaocheng Lan", "Ao Lu", "Kuang Yan", "Heng Lin", "Xinang Xu", "Yuan Luo", "Yueting Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Posterior Matching Distillation", "summary": "Diffusion distillation accelerates image and video generation by compressing a pretrained teacher's iterative sampling process into a few network evaluations. Distribution-based methods achieve this by matching the student's output distribution to the teacher's. This matching is often driven by reverse-KL objectives, whose mode-seeking bias favors dominant teacher modes at the expense of diversity across samples. We introduce Posterior Matching Distillation (PMD), a new member of the distributio", "upvotes": 36, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26629", "arxiv_id": "2611.26629", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Hidir Yesiltepe", "Julius Berner", "Arash Vahdat", "Pinar Yanardag"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Coda-DaVinci: Reimagining Video Generation with Code2Video", "summary": "Code2Video uses agent-authored 3D proxies to guide video generation, enabling explicit control over structure and dynamics. However, how to construct proxies and prompts for optimal downstream quality remains underexplored, as do the capabilities and limitations of this paradigm. Through controlled experiments and blinded human evaluation, we study proxy granularity, physics simulation, and prompting. The results reveal task-dependent trade-offs: coarse proxies favor natural motion, while medium", "upvotes": 35, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26595", "arxiv_id": "2611.26595", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yiyan Ji", "Qixun Wang", "Yang Shi", "Zhuoran Zhang", "Yifan Xu", "Tengfei Liu", "Yuqi Tang", "Xiaohan Zhang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "The Mask Is Not the Object: Volumetric Supervision for 3D Gaussian Segmentation", "summary": "3D Gaussian Splatting enables object-level operations on Gaussian primitives, yet existing segmentation methods are largely trained and evaluated through rendered views. This mismatch can produce accurate rendered masks from incomplete 3D selections since alpha-blended feature supervision concentrates learning on dominant contributors while leaving occluded or low-contribution Gaussians weakly supervised. We propose VODA, a plug-and-play supervision objective that exploits local depth structure ", "upvotes": 32, "num_comments": 4, "url": "https://huggingface.co/papers/2611.21383", "arxiv_id": "2611.21383", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jeonghwan Cho", "Minsu Kim", "Junyoung Hong", "Seon Joo Kim"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth", "summary": "We present Depth Pro 2, an approach to estimating dense metric depth for images and video at full resolution. By analyzing prior methods for monocular depth estimation, we find that they commonly trade off temporal consistency and boundary sharpness: multi-frame methods favor consistency, single-frame methods favor sharpness. To overcome this trade-off, we train a single, scalable network that processes both images and video and predicts depth maps at native resolution. Depth Pro 2 produces dept", "upvotes": 29, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26603", "arxiv_id": "2611.26603", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Peiyun Hu", "Marko Mihajlovic", "Lyndon Duong", "Lahav Lipson", "Wei Dong", "Amaël Delaunoy", "Stephan R. Richter", "Vladlen Koltun"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development", "summary": "Games are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring missing actions. Existing datasets also cover a limited range of games, often without explicit tasks or verifiable outcomes. To address these gaps, we introduce Game2Player, a framework that co-develops game environments and players to collect diverse and verifiable gameplay experience at s", "upvotes": 29, "num_comments": 4, "url": "https://huggingface.co/papers/2611.24154", "arxiv_id": "2611.24154", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Xirui Jiang", "Yuxi Chen", "Rui Yang", "Feng Luo", "Pengcheng Wang", "Bingxuan Li", "Zihao Zhao", "Yushan Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling", "summary": "High-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to produce future high-resolution fields from recent coarse states remains challenging and costly. We formulate this setting as Predictive Spatiotemporal Weather Downscaling (PSWD), a task that jointly refines spatial and temporal resolution while predicting future high-resolution traject", "upvotes": 27, "num_comments": 2, "url": "https://huggingface.co/papers/2611.11318", "arxiv_id": "2611.11318", "published_at": "2026-11-08T00:00:00.000Z", "authors": ["Minseo Yoon", "Minseong Bae", "Sojin Lee", "Hyunwoo J. Kim"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "CurvDelta: Low-Curvature Delta Modeling For Surgical Learning and Unlearning", "summary": "A central challenge in adapting large language models (LLMs) is capability preservation: an adaptation can achieve its target while degrading general capabilities. We introduce CurvDelta, a scalable framework that incorporates the preservation constraint into the parameterization of the model update. By analyzing the local geometry of the preservation constraint around the pre-adaptation model, CurvDelta constructs a low-curvature space in which parameter updates leave the preservation loss near", "upvotes": 26, "num_comments": 2, "url": "https://huggingface.co/papers/2611.24654", "arxiv_id": "2611.24654", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Zeguan Xiao", "Zhuocheng Liang", "Yun Chen", "Yong Wang", "Guanhua Chen", "Pinyan Lu"], "section": "papers", "tags": []}]}, "source_meta": [{"key": "github_trending", "label": "GitHub Trending", "color": "#0f766e"}, {"key": "github_new", "label": "GitHub New", "color": "#2563eb"}, {"key": "reddit", "label": "Reddit", "color": "#ea580c"}, {"key": "hn", "label": "Hacker News", "color": "#d97706"}, {"
