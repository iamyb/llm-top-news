cords", "points": 42, "num_comments": 6, "url": "https://www.404media.co/ice-is-paying-at-t-to-dig-through-a-mountain-of-call-records-hemisphere-data-analytical-services/", "hn_url": "https://news.ycombinator.com/item?id=50562160", "created_at": "2026-11-19T16:24:31+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T16:24:31+00:00", "tags": []}, {"source": "hn", "title": "Making 8-page foldable zines from a single A4 sheet in the browser", "points": 108, "num_comments": 27, "url": "https://krthr.co/paper-folds-and-whats-new-in-fanzines-app/", "hn_url": "https://news.ycombinator.com/item?id=50559719", "created_at": "2026-11-19T13:18:11+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T13:18:11+00:00", "tags": []}, {"source": "hn", "title": "Launch HN: Onlook (YC W25) – An open-source developer tool for designers", "points": 6, "num_comments": 0, "url": "https://github.com/onlook-dev/onlook/", "hn_url": "https://news.ycombinator.com/item?id=50562320", "created_at": "2026-11-19T16:34:04+00:00", "story_text": "Hey HN, I&#x27;m Daniel, founder of Onlook (<a href=\"https:&#x2F;&#x2F;github.com&#x2F;onlook-dev&#x2F;onlook\" rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;onlook-dev&#x2F;onlook<\/a> and onlook.com).<p>Onlook is a desktop app that puts a canvas on top of your real codebase, letting you design directly in code with the agent you already use. Over 25,000 designers and developers have supported the project, 100+ have contributed, and it&#x27;s been the #1 trending repo in the world twice. We just rebuilt the entire product as an agentic design tool, and open-sourced it to the community.<p>Here’s a demo video: (<a href=\"https:&#x2F;&#x2F;youtu.be&#x2F;BogcYWf4siM\" rel=\"nofollow\">https:&#x2F;&#x2F;youtu.be&#x2F;BogcYWf4siM<\/a>)<p>If you&#x27;re an engineer, traditional engineering tools are largely built for convergence, whereas designers tend to explore and diverge on ideas. Onlook gives designers a familiar canvas while managing all of the dev processes that get between them and making mind-blowing designs in code. Designers can work on a multiple simultaneous worktrees that run on the real app locally, and every change lands as a PR you can review or throw away, so there aren’t mockups to rebuild.<p>We built Onlook because we believe there needs to be a developer tool that works the way designers do.<p>More and more, designers are expected to work in code. Designers think by seeing, drafting, arranging variations, using references, and remixing ideas. That’s why the canvas has been the signature feature of design tools because it genuinely is useful for how messy the creative process is. Most of the challenge of using engineering tools for design work is that the first half of starting a project often takes mental bandwidth in of itself (What branch am I on? What page was that last exploration on?) and the second half is constrained by configuring your coded design to present itself (prompting design tools on top of what you’ve built or making temporary navigation for that specific state).<p>Some of you may remember our earlier Show HNs (July 2024: <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=40904862\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=40904862<\/a>, August 2024: <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=41390449\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=41390449<\/a>, May 2025: <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44127653\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44127653<\/a>). Since then, we built a web version (too early), then a Storybook-native build (a mistake). We noticed that our desktop product from July 2024 was still getting hundreds of downloads a month despite zero promotion, so we decided to rebuild it for the new era of designers working in code.<p>How it works…<p>Onlook shines at exploring tons of ideas at once. Ask it to lay out every flow in your product, show every state of a component, or riff on ten versions of one screen. Your designs all show up side by side on an infinite canvas, with each frame as a real webview running your actual app with real data. Not as a mockup, but the real deal.<p>When we built this editor, we had an epiphany that it could be a new kind of IDE for design. Design tools used to be limited to a proprietary setup or closed schema, but now you can push and pull the medium of code to get whatever result you want, so why not give agents an infinite canvas of browsers and see what they do? It turns out, the agents can figure out how to better present coded work by adjusting the urls of browser frames and arranging and resizing them on the canvas.<p>The concept is simple, but it requires a lot of product thinking. For example, because all of the frames on the canvas share a single browser session, and Chromium only allows six connections per host per session, ten frames of the same app end up fighting over limited connections. So, we had to plan around that, and there are still tons of things we need to do to make the canvas ultra performant.<p>Onlook is an Electron app where you can import a repo from GitHub or upload a local folder. Then, Onlook creates a git worktree, starts your dev server, and has the agent sort out missing dependencies or other requirements. You never open a terminal and everything the agent does is a normal git diff that can go to GitHub as a PR. We inject a small script into each frame that draws selection outlines and reads the page, so that way you can click an element, say &quot;make this a card layout,&quot; and the agent knows exactly what &quot;this&quot; is.<p>This time we didn&#x27;t build our own agent. Onlook runs Claude Code or Codex on your own subscription, and we turn whatever the agent emits into one typed event log and draw the UI from that in our own chat interface. On top of that we give the agent a bespoke set of design-specific tools, from arranging frames on the canvas, to making suggestions, to generating multiple iterations of a selection – which is especially useful because the agent decides how to get the app into a state that you need based on your prompt.<p>We also have our own Artifacts which are quick HTML sketches that live in the editor, but outside your repo. They’re almost like components in other design tools in that they can be carried and edited across every project but are detached from the project with no network access. As an example, you can ask the agent to turn your interface into an Artifact, and use it as a reference for another exploration, or download it as HTML and send it to a coworker as an interactive export of something you have in progress. I frequently go back to the artifacts I’ve made as visual snippets when I need new ideas or need to borrow something that’s already been built.<p>The desktop editor is free (you can download it from our website at onlook.com) and open source under Apache-2.0, and we&#x27;ll eventually offer a paid cloud product for teams.<p>We&#x27;d love to hear which repos work and which don&#x27;t, what you try to do on the canvas, and what&#x27;s missing. We’re so excited for this to be a new way for designers to work in code!<p>The Onlook team (Joel - thebrubaker and Kris - krisodd), and I will be here all day!", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T16:34:04+00:00", "tags": []}, {"source": "hn", "title": "Cooling buildings is overtaking heating them as an energy need, IEA says", "points": 51, "num_comments": 43, "url": "https://maccus.fr/en/cooling-overtaking-heating/", "hn_url": "https://news.ycombinator.com/item?id=50560955", "created_at": "2026-11-19T14:57:14+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T14:57:14+00:00", "tags": []}, reated_at": "2026-11-19T14:44:50+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T14:44:50+00:00", "tags": []}, {"source": "hn", "title": "What's New in PHP 8.6", "points": 196, "num_comments": 97, "url": "https://www.php.net/releases/8.6/en.php", "hn_url": "https://news.ycombinator.com/item?id=50557870", "created_at": "2026-11-19T09:27:15+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T09:27:15+00:00", "tags": []}, {"source": "hn", "title": "I built Cornhole News. A Hacker News inspired site for news across the Midwest", "points": 24, "num_comments": 20, "url": "https://cornholenews.news", "hn_url": "https://news.ycombinator.com/item?id=50561515", "created_at": "2026-11-19T15:38:32+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T15:38:32+00:00", "tags": []}, {"source": "hn", "title": "Gemini 4 Neon", "points": 973, "num_comments": 740, "url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/", "hn_url": "https://news.ycombinator.com/item?id=50552424", "created_at": "2026-11-18T21:34:07+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-18T21:34:07+00:00", "tags": []}, {"source": "hn", "title": "Distributed, high-performance blob storage on SQLite", "points": 179, "num_comments": 49, "url": "https://zerodha.tech/blog/high-performance-distributed-blob-storage/", "hn_url": "https://news.ycombinator.com/item?id=50557537", "created_at": "2026-11-19T08:39:45+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T08:39:45+00:00", "tags": []}, {"source": "hn", "title": "Do not buy RAM, compress", "points": 104, "num_comments": 99, "url": "https://curiousbits.nl/blog/do-not-buy-ram-compress/", "hn_url": "https://news.ycombinator.com/item?id=50557661", "created_at": "2026-11-19T08:56:47+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T08:56:47+00:00", "tags": []}, {"source": "hn", "title": "Unblockable communication with gravity – Science Advances", "points": 50, "num_comments": 19, "url": "https://www.science.org/doi/10.1126/sciadv.aee0802", "hn_url": "https://news.ycombinator.com/item?id=50559179", "created_at": "2026-11-19T12:22:00+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T12:22:00+00:00", "tags": []}, {"source": "hn", "title": "UK Government Forced to Admit It Issued Apple a Secret Encryption Order", "points": 18, "num_comments": 0, "url": "https://macanorak.com/uk-government-forced-to-admit-it-issued-apple-a-secret-encryption-order/", "hn_url": "https://news.ycombinator.com/item?id=50562113", "created_at": "2026-11-19T16:21:03+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T16:21:03+00:00", "tags": []}, {"source": "hn", "title": "SSD prices will start going down the second half of next year", "points": 227, "num_comments": 188, "url": "https://www.drivevault.io/blog/when-will-hard-drive-prices-come-down.html", "hn_url": "https://news.ycombinator.com/item?id=50557716", "created_at": "2026-11-19T09:05:34+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T09:05:34+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks", "summary": "We present Xing 4, a series of large language models that extends the TeleChat lineage through coordinated advances in model architecture and training infrastructure on Ascend. This report describes the design principles and systems engineering behind the series, spanning architecture selection, large-scale pretraining, and reasoning and agentic post-training. We study how sparse activation, attention design, model depth and width, and speculative decoding balance model capacity with computation", "upvotes": 158, "num_comments": 3, "url": "https://huggingface.co/papers/2611.22115", "arxiv_id": "2611.22115", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Xingchen AGI Lab", "Baotian Hu", "Bingkai Yang", "Boyang Wang", "Changzai Pan", "Chao Lyu", "Chao Wang", "Chen Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "AscendGYM: A Cost-Aware Kernel Optimization Benchmark for Real-World Workloads on Ascend NPUs", "summary": "Kernel optimization is essential for efficient large language model (LLM) training and inference on Ascend NPUs. Existing Ascend kernel benchmarks primarily focus on kernel generation, with less emphasis on the ability of agents to optimize existing implementations under input configurations drawn from real workloads. To address this requirement, we introduce AscendGYM, a benchmark whose initial suite comprises 48 kernels across three difficulty levels. Each kernel is paired with test cases whos", "upvotes": 92, "num_comments": 3, "url": "https://huggingface.co/papers/2611.17621", "arxiv_id": "2611.17621", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["AI Training Platform Team", "Bingwei Zhang", "Jing Li", "Amir Abdullin", "Sihang Chen", "Xin Chen", "Liangjun Feng", "Yingmeng Gao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Jeveration: System One Models Now Generate", "summary": "System One models such as Jev return decisions through fast, parallel prediction. In this paper, we introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many valid images, yet parallel predictions must converge on a coherent ", "upvotes": 78, "num_comments": 3, "url": "https://huggingface.co/papers/2611.24738", "arxiv_id": "2611.24738", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Yuhe Liu", "Qi Li", "Shihua Zhang", "Xinchao Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Weight-Space Programming Doesn't Need Transformers", "summary": "Standard neural architectures such as the Transformer were chosen because they train well with gradient descent and run fast on GPUs. In weight-space programming, a large language model (LLM) writes target weights by hand without gradient-based training, so those reasons no longer apply. Should we keep the Transformer? Given minimal guidance, ten labeled examples, and a sandbox, mainly on multiple-choice questions, we task three frontier LLMs with either generating the weights of a fixed archite", "upvotes": 53, "num_comments": 3, "url": "https://huggingface.co/papers/2611.22055", "arxiv_id": "2611.22055", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Hyunjong Ok", "Jaeho Lee"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Multi-Branch Transformer", "summary": "Transformer language models are commonly scaled by making their blocks wider or stacking them deeper. In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks. We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared final layers. At comparable training compute, we study three MB", "upvotes": 43, "num_comments": 3, "url": "https://huggingface.co/papers/2611.19800", "arxiv_id": "2611.19800", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Gaotang Li", "Lingjie Chen", "Chunyuan Deng", "Zhiwei Xu", "Hongzheng Chen", "Christopher De Sa", "Jingrui He", "Yingheng Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models", "summary": "Frontier multimodal models can now control robots zero-shot from images, yet many manipulation tasks depend on contact forces that images cannot show. Bringing force to an API-only frozen model raises two challenges. First, contact evolves much faster than an API model can decide, so the system must close the loop on force beneath the model. Second, a frozen model cannot interpret raw force streams, so force must be returned in a form the model can reason about. Therefore, we present ForceHarnes", "upvotes": 40, "num_comments": 3, "url": "https://huggingface.co/papers/2611.21099", "arxiv_id": "2611.21099", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Ke Sun", "Kevin Yuchen Ma", "Yike Zhang", "Yanzhe Chen", "Mike Zheng Shou"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Beyond Answering: Learning to Speak First and Act in Streaming Video", "summary": "Most AI assistants respond only when prompted, remaining silent even when events in the video stream offer meaningful opportunities for conversation. To move beyond purely user-driven interaction, we present AURA 2.0, a streaming video large language model that introduces three core upgrades to AURA. The key advance is Model-Initiated Conversation (MIC), which enables the model to identify topics worth discussing in the evolving visual stream and initiate conversations at appropriate moments wit", "upvotes": 36, "num_comments": 2, "url": "https://huggingface.co/papers/2611.17048", "arxiv_id": "2611.17048", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Shuhan Li", "Huankang Guan", "Xintong Guo", "Yang Bo", "Yuyang He", "Dunyuan Xu", "Jingyan Chen", "Fang Liu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Breath-Dx: A Time Series Classification Benchmark for Disease Screening with eNose", "summary": "Electronic nose (eNose) technology offers a portable, non-invasive route for disease screening via exhaled breath analysis. However, progress in the field is hindered by the lack of systematic benchmarks that compare machine learning methods under realistic conditions, particularly sensor drift, a known but rarely quantified failure mode. Most existing studies rely on small, private datasets with inconsistent protocols, rendering results non-comparable and slowing progress. We introduce Breath-D", "upvotes": 33, "num_comments": 3, "url": "https://huggingface.co/papers/2611.15348", "arxiv_id": "2611.15348", "published_at": "2026-11-11T00:00:00.000Z", "authors": ["Ivan Poddiakov", "Ivan Kruzhilov", "Galina Zubkova", "Svetlana Erofeeva", "Andrey Savchenko", "Pavel Blinov"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "The Resolution Hypothesis: Agent Evolution's Key Is Identifying Improvements", "summary": "Agent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories) and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle: methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but because noisy evaluations cannot reliably identify them. Across", "upvotes": 31, "num_comments": 1, "url": "https://huggingface.co/papers/2611.23068", "arxiv_id": "2611.23068", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Yuanhao Zeng", "Shaocheng Lan", "Ao Lu", "Kuang Yan", "Heng Lin", "Xinang Xu", "Yuan Luo", "Yueting Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Self-Improvement Memory Enables Continual Recursive Self-Improvement", "summary": "Harness optimization is often studied with a fixed policy model and benchmark. When either changes, the optimizer must decide which parts of an evolved harness to reuse or revise, but the harness alone may not explain why earlier edits were made or how they performed. In this work, we study Continual Recursive Self-Improvement (CRSI), a setting for continuing existing harness-optimization methods across compatible benchmarks or policy models. We propose Self-Improvement Memory (SIM) for the harn", "upvotes": 31, "num_comments": 6, "url": "https://huggingface.co/papers/2611.18856", "arxiv_id": "2611.18856", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["Xin Yu", "Fei Xia", "Jiaqi Pan", "Youbao Tang", "Chengzhi Liu", "Adams Yu", "Sicong Jiang", "Yanfei Chen"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ALIVE: Making Streaming Video Models Interactive", "summary": "Streaming video LLMs can continuously observe the world, yet often handle user requests in isolation. We introduce ALIVE, an interactive streaming video model supporting proactive monitoring, streaming task coordination, and feedback-seeking interaction. We construct ALIVE-SFT-288K and ALIVE-RL-3K for two-stage training. Contrastive supervised fine-tuning teaches when and how to respond, while reinforcement learning with Behavior-Aligned Credit Assignment (BACA) combines trajectory-level and loc", "upvotes": 29, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21366", "arxiv_id": "2611.21366", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jinzhao Li", "Yuan Xu", "Jinxuan Wu", "Yukun Wang", "Yijia Lei", "Hanyu Ji", "Yinuo Chen", "Zining Huang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling", "summary": "High-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to produce future high-resolution fields from recent coarse states remains challenging and costly. We formulate this setting as Predictive Spatiotemporal Weather Downscaling (PSWD), a task that jointly refines spatial and temporal resolution while predicting future high-resolution traject", "upvotes": 27, "num_comments": 1, "url": "https://huggingface.co/papers/2611.11318", "arxiv_id": "2611.11318", "published_at": "2026-11-08T00:00:00.000Z", "authors": ["Minseo Yoon", "Minseong Bae", "Sojin Lee", "Hyunwoo J. Kim"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "FastFrames: Video Generation at Interactive Latency", "summary": "Autoregressive video diffusion models generate frames based on new observations and inputs, making them a promising medium for interactive visual experiences. However, existing models are orders of magnitude too slow for fluid interaction. This paper introduces FastFrames, a family of fast autoregressive video diffusion models that achieves interactive latency without compromising quality. We profile the inference pipeline of state-of-the-art models and find that operations often treated as fixe", "upvotes": 27, "num_comments": 6, "url": "https://huggingface.co/papers/2611.23226", "arxiv_id": "2611.23226", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Gene Chou", "Guandao Yang", "Fujun Luan", "Lars Mescheder", "Wei Dong", "Stephan Richter", "Vladlen Koltun"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "TCP4D: A Unified Tool-Center-Point Tracking and Generation Model for Robot Manipulation", "summary": "Robot manipulation videos provide a rich visual experience, yet recovering robot action and gripper-state annotations from RGB observations still remains challenging. Using the embodiment-agnostic tool-center-point (TCP) pose as the action space, we present TCP4D, a unified model in which a shared 4D scene representation both tracks ob [], "section": "community", "summary": "", "published_at": "2026-11-19T16:24:31+00:00", "tags": []}, {"source": "hn", "title": "Making 8-page foldable zines from a single A4 sheet in the browser", "points": 108, "num_comments": 27, "url": "https://krthr.co/paper-folds-and-whats-new-in-fanzines-app/", "hn_url": "https://news.ycombinator.com/item?id=50559719", "created_at": "2026-11-19T13:18:11+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T13:18:11+00:00", "tags": []}, {"source": "hn", "title": "Launch HN: Onlook (YC W25) – An open-source developer tool for designers", "points": 6, "num_comments": 0, "url": "https://github.com/onlook-dev/onlook/", "hn_url": "https://news.ycombinator.com/item?id=50562320", "created_at": "2026-11-19T16:34:04+00:00", "story_text": "Hey HN, I&#x27;m Daniel, founder of Onlook (<a href=\"https:&#x2F;&#x2F;github.com&#x2F;onlook-dev&#x2F;onlook\" rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;onlook-dev&#x2F;onlook<\/a> and onlook.com).<p>Onlook is a desktop app that puts a canvas on top of your real codebase, letting you design directly in code with the agent you already use. Over 25,000 designers and developers have supported the project, 100+ have contributed, and it&#x27;s been the #1 trending repo in the world twice. We just rebuilt the entire product as an agentic design tool, and open-sourced it to the community.<p>Here’s a demo video: (<a href=\"https:&#x2F;&#x2F;youtu.be&#x2F;BogcYWf4siM\" rel=\"nofollow\">https:&#x2F;&#x2F;youtu.be&#x2F;BogcYWf4siM<\/a>)<p>If you&#x27;re an engineer, traditional engineering tools are largely built for convergence, whereas designers tend to explore and diverge on ideas. Onlook gives designers a familiar canvas while managing all of the dev processes that get between them and making mind-blowing designs in code. Designers can work on a multiple simultaneous worktrees that run on the real app locally, and every change lands as a PR you can review or throw away, so there aren’t mockups to rebuild.<p>We built Onlook because we believe there needs to be a developer tool that works the way designers do.<p>More and more, designers are expected to work in code. Designers think by seeing, drafting, arranging variations, using references, and remixing ideas. That’s why the canvas has been the signature feature of design tools because it genuinely is useful for how messy the creative process is. Most of the challenge of using engineering tools for design work is that the first half of starting a project often takes mental bandwidth in of itself (What branch am I on? What page was that last exploration on?) and the second half is constrained by configuring your coded design to present itself (prompting design tools on top of what you’ve built or making temporary navigation for that specific state).<p>Some of you may remember our earlier Show HNs (July 2024: <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=40904862\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=40904862<\/a>, August 2024: <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=41390449\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=41390449<\/a>, May 2025: <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44127653\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=44127653<\/a>). Since then, we built a web version (too early), then a Storybook-native build (a mistake). We noticed that our desktop product from July 2024 was still getting hundreds of downloads a month despite zero promotion, so we decided to rebuild it for the new era of designers working in code.<p>How it works…<p>Onlook shines at exploring tons of ideas at once. Ask it to lay out every flow in your product, show every state of a component, or riff on ten versions of one screen. Your designs all show up side by side on an infinite canvas, with each frame as a real webview running your actual app with real data. Not as a mockup, but the real deal.<p>When we built this editor, we had an epiphany that it could be a new kind of IDE for design. Design tools used to be limited to a proprietary setup or closed schema, but now you can push and pull the medium of code to get whatever result you want, so why not give agents an infinite canvas of browsers and see what they do? It turns out, the agents can figure out how to better present coded work by adjusting the urls of browser frames and arranging and resizing them on the canvas.<p>The concept is simple, but it requires a lot of product thinking. For example, because all of the frames on the canvas share a single browser session, and Chromium only allows six connections per host per session, ten frames of the same app end up fighting over limited connections. So, we had to plan around that, and there are still tons of things we need to do to make the canvas ultra performant.<p>Onlook is an Electron app where you can import a repo from GitHub or upload a local folder. Then, Onlook creates a git worktree, starts your dev server, and has the agent sort out missing dependencies or other requirements. You never open a terminal and everything the agent does is a normal git diff that can go to GitHub as a PR. We inject a small script into each frame that draws selection outlines and reads the page, so that way you can click an element, say &quot;make this a card layout,&quot; and the agent knows exactly what &quot;this&quot; is.<p>This time we didn&#x27;t build our own agent. Onlook runs Claude Code or Codex on your own subscription, and we turn whatever the agent emits into one typed event log and draw the UI from that in our own chat interface. On top of that we give the agent a bespoke set of design-specific tools, from arranging frames on the canvas, to making suggestions, to generating multiple iterations of a selection – which is especially useful because the agent decides how to get the app into a state that you need based on your prompt.<p>We also have our own Artifacts which are quick HTML sketches that live in the editor, but outside your repo. They’re almost like components in other design tools in that they can be carried and edited across every project but are detached from the project with no network access. As an example, you can ask the agent to turn your interface into an Artifact, and use it as a reference for another exploration, or download it as HTML and send it to a coworker as an interactive export of something you have in progress. I frequently go back to the artifacts I’ve made as visual snippets when I need new ideas or need to borrow something that’s already been built.<p>The desktop editor is free (you can download it from our website at onlook.com) and open source under Apache-2.0, and we&#x27;ll eventually offer a paid cloud product for teams.<p>We&#x27;d love to hear which repos work and which don&#x27;t, what you try to do on the canvas, and what&#x27;s missing. We’re so excited for this to be a new way for designers to work in code!<p>The Onlook team (Joel - thebrubaker and Kris - krisodd), and I will be here all day!", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T16:34:04+00:00", "tags": []}, {"source": "hn", "title": "Cooling buildings is overtaking heating them as an energy need, IEA says", "points": 51, "num_comments": 43, "url": "https://maccus.fr/en/cooling-overtaking-heating/", "hn_url": "https://news.ycombinator.com/item?id=50560955", "created_at": "2026-11-19T14:57:14+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T14:57:14+00:00", "tags": []}, {"source": "hn", "title": "Someone reported java4shell bug in September 2026", "points": 138, "num_comments": 41, "url": "https://github.com/openjdk/jdk/pull/32781", "hn_url": "https://news.ycombinator.com/item?id=50558906", "created_at": "2026-11-19T11:47:03+00:00", "story_text": "", "matched_keywords": [], "s vances", "points": 50, "num_comments": 19, "url": "https://www.science.org/doi/10.1126/sciadv.aee0802", "hn_url": "https://news.ycombinator.com/item?id=50559179", "created_at": "2026-11-19T12:22:00+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T12:22:00+00:00", "tags": []}, {"source": "hn", "title": "UK Government Forced to Admit It Issued Apple a Secret Encryption Order", "points": 18, "num_comments": 0, "url": "https://macanorak.com/uk-government-forced-to-admit-it-issued-apple-a-secret-encryption-order/", "hn_url": "https://news.ycombinator.com/item?id=50562113", "created_at": "2026-11-19T16:21:03+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T16:21:03+00:00", "tags": []}, {"source": "hn", "title": "SSD prices will start going down the second half of next year", "points": 227, "num_comments": 188, "url": "https://www.drivevault.io/blog/when-will-hard-drive-prices-come-down.html", "hn_url": "https://news.ycombinator.com/item?id=50557716", "created_at": "2026-11-19T09:05:34+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-19T09:05:34+00:00", "tags": []}], "papers": [{"source": "hf_papers", "title": "TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks", "summary": "We present Xing 4, a series of large language models that extends the TeleChat lineage through coordinated advances in model architecture and training infrastructure on Ascend. This report describes the design principles and systems engineering behind the series, spanning architecture selection, large-scale pretraining, and reasoning and agentic post-training. We study how sparse activation, attention design, model depth and width, and speculative decoding balance model capacity with computation", "upvotes": 158, "num_comments": 3, "url": "https://huggingface.co/papers/2611.22115", "arxiv_id": "2611.22115", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Xingchen AGI Lab", "Baotian Hu", "Bingkai Yang", "Boyang Wang", "Changzai Pan", "Chao Lyu", "Chao Wang", "Chen Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "AscendGYM: A Cost-Aware Kernel Optimization Benchmark for Real-World Workloads on Ascend NPUs", "summary": "Kernel optimization is essential for efficient large language model (LLM) training and inference on Ascend NPUs. Existing Ascend kernel benchmarks primarily focus on kernel generation, with less emphasis on the ability of agents to optimize existing implementations under input configurations drawn from real workloads. To address this requirement, we introduce AscendGYM, a benchmark whose initial suite comprises 48 kernels across three difficulty levels. Each kernel is paired with test cases whos", "upvotes": 92, "num_comments": 3, "url": "https://huggingface.co/papers/2611.17621", "arxiv_id": "2611.17621", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["AI Training Platform Team", "Bingwei Zhang", "Jing Li", "Amir Abdullin", "Sihang Chen", "Xin Chen", "Liangjun Feng", "Yingmeng Gao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Jeveration: System One Models Now Generate", "summary": "System One models such as Jev return decisions through fast, parallel prediction. In this paper, we introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many valid images, yet parallel predictions must converge on a coherent ", "upvotes": 78, "num_comments": 3, "url": "https://huggingface.co/papers/2611.24738", "arxiv_id": "2611.24738", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Yuhe Liu", "Qi Li", "Shihua Zhang", "Xinchao Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Weight-Space Programming Doesn't Need Transformers", "summary": "Standard neural architectures such as the Transformer were chosen because they train well with gradient descent and run fast on GPUs. In weight-space programming, a large language model (LLM) writes target weights by hand without gradient-based training, so those reasons no longer apply. Should we keep the Transformer? Given minimal guidance, ten labeled examples, and a sandbox, mainly on multiple-choice questions, we task three frontier LLMs with either generating the weights of a fixed archite", "upvotes": 53, "num_comments": 3, "url": "https://huggingface.co/papers/2611.22055", "arxiv_id": "2611.22055", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Hyunjong Ok", "Jaeho Lee"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Multi-Branch Transformer", "summary": "Transformer language models are commonly scaled by making their blocks wider or stacking them deeper. In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks. We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared final layers. At comparable training compute, we study three MB", "upvotes": 43, "num_comments": 3, "url": "https://huggingface.co/papers/2611.19800", "arxiv_id": "2611.19800", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Gaotang Li", "Lingjie Chen", "Chunyuan Deng", "Zhiwei Xu", "Hongzheng Chen", "Christopher De Sa", "Jingrui He", "Yingheng Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models", "summary": "Frontier multimodal models can now control robots zero-shot from images, yet many manipulation tasks depend on contact forces that images cannot show. Bringing force to an API-only frozen model raises two challenges. First, contact evolves much faster than an API model can decide, so the system must close the loop on force beneath the model. Second, a frozen model cannot interpret raw force streams, so force must be returned in a form the model can reason about. Therefore, we present ForceHarnes", "upvotes": 40, "num_comments": 3, "url": "https://huggingface.co/papers/2611.21099", "arxiv_id": "2611.21099", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Ke Sun", "Kevin Yuchen Ma", "Yike Zhang", "Yanzhe Chen", "Mike Zheng Shou"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Beyond Answering: Learning to Speak First and Act in Streaming Video", "summary": "Most AI assistants respond only when prompted, remaining silent even when events in the video stream offer meaningful opportunities for conversation. To move beyond purely user-driven interaction, we present AURA 2.0, a streaming video large language model that introduces three core upgrades to AURA. The key advance is Model-Initiated Conversation (MIC), which enables the model to identify topics worth discussing in the evolving visual stream and initiate conversations at appropriate moments wit", "upvotes": 36, "num_comments": 2, "url": "https://huggingface.co/papers/2611.17048", "arxiv_id": "2611.17048", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Shuhan Li", "Huankang Guan", "Xintong Guo", "Yang Bo", "Yuyang He", "Dunyuan Xu", "Jingyan Chen", "Fang Liu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Breath-Dx: A Time Series Classification Benchmark for Disease Screening with eNose", "summary": "Electronic nose (eNose) technology offers a portable, non-invasive route for disease screening via exhaled breath analysis. However, progress in the field is hindered by the lack of systematic benchmarks that compare machine learning methods under realistic conditions, particularly sensor drift, a known but rarely quantified failure mode. Most existing studies rely on small, private datasets with inconsistent protocols, rendering results non-comparable and slowing progress. We introduce Breath-D", "upvotes": 33, "num_comments": 3, "url": "https://huggingface.co/papers/2611.15348", "arxiv_id": "2611.15348", "published_at": "2026-11-11T00:00:00.000Z", "authors": ["Ivan Poddiakov", "Ivan Kruzhilov", "Galina Zubkova", "Svetlana Erofeeva", "Andrey Savchenko", "Pavel Blinov"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "The Resolution Hypothesis: Agent Evolution's Key Is Identifying Improvements", "summary": "Agent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories) and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle: methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but because noisy evaluations cannot reliably identify them. Across", "upvotes": 31, "num_comments": 1, "url": "https://huggingface.co/papers/2611.23068", "arxiv_id": "2611.23068", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Yuanhao Zeng", "Shaocheng Lan", "Ao Lu", "Kuang Yan", "Heng Lin", "Xinang Xu", "Yuan Luo", "Yueting Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Self-Improvement Memory Enables Continual Recursive Self-Improvement", "summary": "Harness optimization is often studied with a fixed policy model and benchmark. When either changes, the optimizer must decide which parts of an evolved harness to reuse or revise, but the harness alone may not explain why earlier edits were made or how they performed. In this work, we study Continual Recursive Self-Improvement (CRSI), a setting for continuing existing harness-optimization methods across compatible benchmarks or policy models. We propose Self-Improvement Memory (SIM) for the harn", "upvotes": 31, "num_comments": 6, "url": "https://huggingface.co/papers/2611.18856", "arxiv_id": "2611.18856", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["Xin Yu", "Fei Xia", "Jiaqi Pan", "Youbao Tang", "Chengzhi Liu", "Adams Yu", "Sicong Jiang", "Yanfei Chen"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ALIVE: Making Streaming Video Models Interactive", "summary": "Streaming video LLMs can continuously observe the world, yet often handle user requests in isolation. We introduce ALIVE, an interactive streaming video model supporting proactive monitoring, streaming task coordination, and feedback-seeking interaction. We construct ALIVE-SFT-288K and ALIVE-RL-3K for two-stage training. Contrastive supervised fine-tuning teaches when and how to respond, while reinforcement learning with Behavior-Aligned Credit Assignment (BACA) combines trajectory-level and loc", "upvotes": 29, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21366", "arxiv_id": "2611.21366", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jinzhao Li", "Yuan Xu", "Jinxuan Wu", "Yukun Wang", "Yijia Lei", "Hanyu Ji", "Yinuo Chen", "Zining Huang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling", "summary": "High-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to produce future high-resolution fields from recent coarse states remains challenging and costly. We formulate this setting as Predictive Spatiotemporal Weather Downscaling (PSWD), a task that jointly refines spatial and temporal resolution while predicting future high-resolution traject", "upvotes": 27, "num_comments": 1, "url": "https://huggingface.co/papers/2611.11318", "arxiv_id": "2611.11318", "published_at": "2026-11-08T00:00:00.000Z", "authors": ["Minseo Yoon", "Minseong Bae", "Sojin Lee", "Hyunwoo J. Kim"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "FastFrames: Video Generation at Interactive Latency", "summary": "Autoregressive video diffusion models generate frames based on new observations and inputs, making them a promising medium for interactive visual experiences. However, existing models are orders of magnitude too slow for fluid interaction. This paper introduces FastFrames, a family of fast autoregressive video diffusion models that achieves interactive latency without compromising quality. We profile the inference pipeline of state-of-the-art models and find that operations often treated as fixe", "upvotes": 27, "num_comments": 6, "url": "https://huggingface.co/papers/2611.23226", "arxiv_id": "2611.23226", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Gene Chou", "Guandao Yang", "Fujun Luan", "Lars Mescheder", "Wei Dong", "Stephan Richter", "Vladlen Koltun"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "TCP4D: A Unified Tool-Center-Point Tracking and Generation Model for Robot Manipulation", "summary": "Robot manipulation videos provide a rich visual experience, yet recovering robot action and gripper-state annotations from RGB observations still remains challenging. Using the embodiment-agnostic tool-center-point (TCP) pose as the action space, we present TCP4D, a unified model in which a shared 4D scene representation both tracks observed TCP motion and generates future TCP trajectories. Given a monocular video and initial 2D TCP queries, the tracker directly recovers metric TCP poses in SE(3", "upvotes": 24, "num_comments": 4, "url": "https://huggingface.co/papers/2611.23143", "arxiv_id": "2611.23143", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Haosong Peng", "Xiangyang Liu", "Zhengshen Zhang", "Yunfeng Fan", "Tianyu Qi", "Xin Xia", "Yufeng Zhan", "Wenchao Xu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development", "summary": "Games are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring missing actions. Existing datasets also cover a limited range of games, often without explicit tasks or verifiable outcomes. To address these gaps, we introduce Game2Player, a framework that co-develops game environments and players to collect diverse and verifiable gameplay experience at s", "upvotes": 23, "num_comments": 1, "url": "https://huggingface.co/papers/2611.24154", "arxiv_id": "2611.24154", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["Xirui Jiang", "Yuxi Chen", "Rui Yang", "Feng Luo", "Pengcheng Wang", "Bingxuan Li", "Zihao Zhao", "Yushan Li"], "section": "papers", "tags": []}], "applications": []}, "section_meta": [{"key": "github", "label": "GitHub", "sources": ["github_trending", "github_new"]}, {"key": "community", "label": "Community Pulse", "sources": ["reddit", "hn"]}, {"key": "papers", "label": "Papers", "sources": ["hf_papers"]}, {"key": "applications", "label": "LLM Applications", "sources": []}], "cross": []}}</script>
