itle": "Ladybird is now in alpha", "points": 798, "num_comments": 222, "url": "https://ladybird.org/posts/alpha/", "hn_url": "https://news.ycombinator.com/item?id=50614249", "created_at": "2026-11-23T16:13:12+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T16:13:12+00:00", "tags": []}, {"source": "hn", "title": "\"Per ARM's Request, This Site Will Be Discontinued on 4 December 2026\"", "points": 93, "num_comments": 13, "url": "https://arm.jonpalmisc.com/", "hn_url": "https://news.ycombinator.com/item?id=50617499", "created_at": "2026-11-23T19:17:55+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T19:17:55+00:00", "tags": []}, {"source": "hn", "title": "GLM-5.4: Toward generalized coding with our first loop transformer", "points": 888, "num_comments": 308, "url": "https://z.ai/blog/glm-5.4", "hn_url": "https://news.ycombinator.com/item?id=50609685", "created_at": "2026-11-23T10:06:43+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T10:06:43+00:00", "tags": []}, {"source": "hn", "title": "NariQ: BF16-level Qwen3.8-27B in a 10 GB file", "points": 36, "num_comments": 4, "url": "https://huggingface.co/nari-labs/Qwen3.8-27B-NariQ-GGUF", "hn_url": "https://news.ycombinator.com/item?id=50611402", "created_at": "2026-11-23T13:42:38+00:00", "story_text": "We built NariQ: 3-bit-or-lower quantizations of Qwen3.8-27B that retain near-BF16 quality across agentic tasks, math, multilingual reasoning, and image understanding.<p>To our knowledge, this is the first 3-bit-or-lower quantization that retains BF16 lvl performance on long-horizon agentic tasks.<p>Benchmarks (BF16 &#x2F; 3-bit &#x2F; 2.5-bit &#x2F; 2-bit):<p>- DeepSWE: 39.8 &#x2F; 41.0 &#x2F; 41.9 &#x2F; 28.6<p>- Terminal-Bench 2.1: 62.6 &#x2F; 63.8 &#x2F; 60.2 &#x2F; 52.4<p>- AIME 25+26: 97.7 &#x2F; 98.3 &#x2F; 96.5 &#x2F; 86.0<p>- MSGM: 94.0 &#x2F; 93.1 &#x2F; 91.8 &#x2F; 90.6<p>- RealWorldQA: 82.4 &#x2F; 82.4 &#x2F; 81.3 &#x2F; 80.9<p>Decode speed is comparable to other quants on an RTX PRO 6000. Context-length results below<p>(3-bit &#x2F; 2.5-bit &#x2F; 2-bit &#x2F; Unsloth UD-IQ3_XXS):<p>- 4K: 88.9 &#x2F; 99.2 &#x2F; 111.7 &#x2F; 94.7<p>- 16K: 84.5 &#x2F; 93.8 &#x2F; 105.1 &#x2F; 89.8<p>- 64K: 70.7 &#x2F; 77.5 &#x2F; 85.0 &#x2F; 74.8<p>Running these currently require our llama.cpp fork:\n(<a href=\"https:&#x2F;&#x2F;github.com&#x2F;nari-labs&#x2F;nari-llama.cpp\" rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;nari-labs&#x2F;nari-llama.cpp<\/a>)<p>Feedback and questions welcome. We&#x27;d love to hear how these perform on your workloads.", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T13:42:38+00:00", "tags": []}, {"source": "hn", "title": "Kagi Mail (public beta)", "points": 163, "num_comments": 128, "url": "https://blog.kagi.com/kagi-mail-public-beta", "hn_url": "https://news.ycombinator.com/item?id=50615481", "created_at": "2026-11-23T17:17:01+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T17:17:01+00:00", "tags": []}, {"source": "hn", "title": "Nospeaker ─ Make your MacBook's trackpad talk using its haptic motor", "points": 208, "num_comments": 115, "url": "https://github.com/os6/nospeaker", "hn_url": "https://news.ycombinator.com/item?id=50610318", "created_at": "2026-11-23T11:31:54+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T11:31:54+00:00", "tags": []}, {"source": "hn", "title": "Win4wine – Run Windows Shell as the Linux Desktop on Wine", "points": 161, "num_comments": 89, "url": "https://github.com/mikuta0407/win4wine", "hn_url": "https://news.ycombinator.com/item?id=50610743", "created_at": "2026-11-23T12:28:11+00:00", "story_text": "", "matched_keywords": [], "section": "community ordpress.com/2026/11/01/nespresso-project-olympus/", "hn_url": "https://news.ycombinator.com/item?id=50605479", "created_at": "2026-11-22T23:57:45+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-22T23:57:45+00:00", "tags": []}, {"source": "hn", "title": "Cyberleek posted the GTA 6 Xbox build executable", "points": 149, "num_comments": 152, "url": "https://www.reddit.com/r/GamingLeaksAndRumours/comments/1y3jzqe/cyberleek_posted_the_gta_6_xbox_build_executable/", "hn_url": "https://news.ycombinator.com/item?id=50612686", "created_at": "2026-11-23T14:49:44+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T14:49:44+00:00", "tags": []}, {"source": "hn", "title": "Yes, 17M lines of Lean is a lot", "points": 243, "num_comments": 302, "url": "https://micjm.com/blog/yes-17m-lines-of-lean-is-a-lot/", "hn_url": "https://news.ycombinator.com/item?id=50607668", "created_at": "2026-11-23T05:00:49+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T05:00:49+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction", "summary": "Manifold-constrained Hyper-Connections (mHC) extends residual connections to multiple streams and stabilizes residual propagation by constraining stream-mixing residual matrices to the Birkhoff polytope, the set of doubly stochastic matrices. In this work, we investigate how to effectively mix residual streams within the Birkhoff polytope. We reveal a mixing trade-off: when under-mixed residual matrices stay close to the vertices of the Birkhoff polytope, hyper-connections will degenerate into a", "upvotes": 85, "num_comments": 2, "url": "https://huggingface.co/papers/2611.27193", "arxiv_id": "2611.27193", "published_at": "2026-11-20T00:00:00.000Z", "authors": ["Haowei He", "Ziwen Zhao", "Chenshuo Pan", "Gang Lin", "Zhihao Yang", "Chao Wang", "Xinzhang Liu", "Kaidong Yu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation", "summary": "Embodied intelligence aims to let robots perform complex physical tasks with human-like adaptability and reliability, which requires three complementary capabilities: history-based cognitive reasoning, precise and timely physical execution, and the composition of reasoning and execution through environmental feedback. Yet existing benchmarks either evaluate reasoning and execution within the same tasks or assess them separately without their composition, so they reveal little about whether a fai", "upvotes": 57, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26444", "arxiv_id": "2611.26444", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yuzhi Huang", "Jie Wu", "Fanding Huang", "Junchao Lin", "Weichen Zhang", "Ziyi Xiong", "Yang Li", "Zhengwei Xie"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection", "summary": "Recent advances in video generation call for reliable detection grounded in explicit forensic evidence. However, current methods primarily depend on single-pass chain-of-thought reasoning that overlooks brief or localized artifacts, or on predefined multi-agent workflows that offer limited flexibility in selecting relevant inspections. Even with adaptive investigation, optimizing the investigation policy alone does not directly improve the forensic capabilities of fixed experts. We introduce WeV", "upvotes": 55, "num_comments": 3, "url": "https://huggingface.co/papers/2611.21373", "arxiv_id": "2611.21373", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Yipeng Du", "Yuxi Li", "Ying Zhang", "Chong Sun", "Chen Li", "Jing Lyu", "Ying Tai"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Non-penetrating World Models", "summary": "We study a new problem of preventing object penetration in interactive video world models. To understand how existing models handle this, we introduce NoPeBench, a benchmark that evaluates how world models respond to physical obstacles. Our evaluation reveals that none of the open-source models can reliably prevent such failures. Surprisingly, however, these models already encode the information needed to predict such violations. We find that the hidden states of diffusion transformers (DiTs) ca", "upvotes": 54, "num_comments": 2, "url": "https://huggingface.co/papers/2611.27963", "arxiv_id": "2611.27963", "published_at": "2026-11-20T00:00:00.000Z", "authors": ["Yuhang Dai", "Yinwei Wu", "Ziyue Lin", "Han Ji", "Xingyi Yang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding", "summary": "Video understanding, particularly with accompanying audio, remains a central challenge in multimodal intelligence. In this report, we introduce WeMM-Video, a family of Chinese-English bilingual omni-modal foundation models spanning 2B, 4B, 9B, and 35B-A3B variants. Centering on joint audio-visual perception and reasoning, WeMM-Video unifies text, image, audio, and video processing within a hybrid-thinking paradigm, seamlessly supporting both a non-thinking instruct mode for fast, direct response", "upvotes": 49, "num_comments": 3, "url": "https://huggingface.co/papers/2611.26409", "arxiv_id": "2611.26409", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Changli Tang", "Jie Yang", "Tianyi Wang", "Lei Li", "Daoze Zhang", "Zijie Xin", "Zhan Liu", "Li Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Posterior Matching Distillation", "summary": "Diffusion distillation accelerates image and video generation by compressing a pretrained teacher's iterative sampling process into a few network evaluations. Distribution-based methods achieve this by matching the student's output distribution to the teacher's. This matching is often driven by reverse-KL objectives, whose mode-seeking bias favors dominant teacher modes at the expense of diversity across samples. We introduce Posterior Matching Distillation (PMD), a new member of the distributio", "upvotes": 42, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26629", "arxiv_id": "2611.26629", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Hidir Yesiltepe", "Julius Berner", "Arash Vahdat", "Pinar Yanardag"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Coda-DaVinci: Reimagining Video Generation with Code2Video", "summary": "Code2Video uses agent-authored 3D proxies to guide video generation, enabling explicit control over structure and dynamics. However, how to construct proxies and prompts for optimal downstream quality remains underexplored, as do the capabilities and limitations of this paradigm. Through controlled experiments and blinded human evaluation, we study proxy granularity, physics simulation, and prompting. The results reveal task-dependent trade-offs: coarse proxies favor natural motion, while medium", "upvotes": 39, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26595", "arxiv_id": "2611.26595", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yiyan Ji", "Qixun Wang", "Yang Shi", "Zhuoran Zhang", "Yifan Xu", "Tengfei Liu", "Yuqi Tang", "Xiaohan Zhang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth", "summary": "We present Depth Pro 2, an approach to estimating dense metric depth for images and video at full resolution. By analyzing prior methods for monocular depth estimation, we find that they commonly trade off temporal consistency and boundary sharpness: multi-frame methods favor consistency, single-frame methods favor sharpness. To overcome this trade-off, we train a single, scalable network that processes both images and video and predicts depth maps at native resolution. Depth Pro 2 produces dept", "upvotes": 37, "num_comments": 3, "url": "https://huggingface.co/papers/2611.26603", "arxiv_id": "2611.26603", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Peiyun Hu", "Marko Mihajlovic", "Lyndon Duong", "Lahav Lipson", "Wei Dong", "Amaël Delaunoy", "Stephan R. Richter", "Vladlen Koltun"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Clover-35B-A3B-Preview Technical Report", "summary": "We introduce Clover-35B-A3B-Preview (Clover), a mixture-of-experts diffusion language model with 35 billion total parameters and 3 billion activated parameters, supporting thinking-mode generation. Clover adapts Gated Delta Networks to block diffusion by combining recurrent memory of previously generated context with bidirectional softmax attention inside the current block. Historical memory readout competes with current-block tokens in a shared softmax, with learnable block-size calibration and", "upvotes": 36, "num_comments": 3, "url": "https://huggingface.co/papers/2611.24636", "arxiv_id": "2611.24636", "published_at": "2026-11-18T00:00:00.000Z", "authors": ["DiffuSpace Technical Team"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Probing the \"Conscious\" Mind: Selective Access and Global Workspace in Vision-Language Models", "summary": "Vision-language models (VLMs) integrate visual and textual information, but their outputs do not reveal internal concept representations. Global workspace theory (GWT) proposes that information is selected from parallel brain processes, integrated in a shared workspace, and made available to specialised processes. We introduce the Multimodal Concept Lens (MC-Lens), a multimodal Jacobian lens, to study these functions in VLM concept processing. Its vision encoder and language decoder lenses map i", "upvotes": 36, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26590", "arxiv_id": "2611.26590", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Jiahao Huang", "Jun Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "The Mask Is Not the Object: Volumetric Supervision for 3D Gaussian Segmentation", "summary": "3D Gaussian Splatting enables object-level operations on Gaussian primitives, yet existing segmentation methods are largely trained and evaluated through rendered views. This mismatch can produce accurate rendered masks from incomplete 3D selections since alpha-blended feature supervision concentrates learning on dominant contributors while leaving occluded or low-contribution Gaussians weakly supervised. We propose VODA, a plug-and-play supervision objective that exploits local depth structure ", "upvotes": 35, "num_comments": 4, "url": "https://huggingface.co/papers/2611.21383", "arxiv_id": "2611.21383", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jeonghwan Cho", "Minsu Kim", "Junyoung Hong", "Seon Joo Kim"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "EgoCaptioner: Towards Comprehensive and Fine-Grained Egocentric Video Captioning", "summary": "Egocentric video captioning requires fine-grained detail and accurate timing, yet current multimodal large language models (MLLMs) often miss brief actions, confuse their order, or misinterpret the wearer's motion. Existing caption formats also offer limited support for combining detailed narration with precise timing. We present EgoCaptioner, which pairs a video-level overview of the setting, participants, and the wearer's overall activity with timed steps whose narration adapts to varying perc", "upvotes": 26, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26380", "arxiv_id": "2611.26380", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yuqi Tang", "Yang Shi", "Yuran Wang", "Tengfei Liu", "Rundong Wang", "Zongyang Qiu", "Qixun Wang", "Zhuoran Zhang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "HiUni: Harmonizing Understanding and Generation in Shared Visual Space", "summary": "Unified multimodal models aim to support visual understanding and generation within a single framework. However, prevailing approaches often separate their visual representations or backbone computation to accommodate the different requirements of these two tasks, which limits the degree of unification. In this paper, we present HiUni, which revisits this design choice and explores whether a pretrained vision language model can be directly extended into a unified model with extensive parameter s", "upvotes": 25, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26107", "arxiv_id": "2611.26107", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Jiahao Hu", "Jingdong Du", "Yichen Zhang", "Yi Song", "Zhenyu Zhang", "Jiaxin Niu", "Ruihang Li", "Xiangzhao Hao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators", "summary": "Large language models (LLMs) are increasingly used as judges and graders to replace human annotators, raising the question of when such replacement is statistically justified. To support such decisions, the Alternative Annotator Test (Alt-Test) was introduced for dense settings where all items are annotated by the same annotators. However, in many large-scale annotation settings, items are annotated by different subsets of annotators. We therefore propose the Alternative Annotator Test with Resa", "upvotes": 24, "num_comments": 3, "url": "https://huggingface.co/papers/2611.26073", "arxiv_id": "2611.26073", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Nagham Omar", "Rotem Dror", "Almog Gueta", "Avigdor Gal", "Roi Reichart", "Nitay Calderon"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "TuringSpace: Grounding Spatial Intelligence in Action with Interactive CAPTCHAs", "summary": "Humans act in the visual world by inferring the 3D layout behind a 2D view, predicting how an action changes it, and correcting themselves after seeing the result. Can multimodal large language models (MLLMs) do the same? CAPTCHAs offer a natural test, since humans solve them through this very loop, clicking and dragging on the screen and adjusting after each result. Yet existing CAPTCHA benchmarks are largely solved and rarely spatial, while spatial benchmarks rarely require action. We therefor", "upvotes": 23, "num_comments": 2, "url": "https://huggingface.co/papers/2611.25387", "arxiv_id": "2611.25387", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Xuwei Ding", "Skylar Zhai", "Linxin Song", "Jiarui Feng", "Dongqi Fu", "Huajun Xi", "Junnan Li", "Jingcheng Liang"], "section": "papers", "tags": []}]}, "source_meta": [{"key": "github_trending", "label": "GitHub Trending", "color": "#0f766e"}, {"key": "github_new", "label": "GitHub New", "color": "#2563eb"}, {"key": "reddit", "label": "Reddit", "color": "#ea580c"}, {"key": "hn", "label": "Hacker News", "color": "#d97706"}, {"key": "hf_papers", "label": "HF Papers", "color": "#8b5cf6"}], "sections": {"github": [{"source": "github_trending", "full_name": "elementalsouls/Claude-BugHunter", "description": "A Claude Code skill bundle for bug hunting and external red-team work - 82 skills, 15 slash commands, 681 disclosed-report patterns curated across 24 core vulnerability classes, plus enterprise identity + infrastructure attack matrices.", "stars": 19453, "stars_today": 2037, "url": "https://github.com/elementalsouls/Claude-BugHunter", "language": "Python", "topics": [], "github_kind": "trending", "section": "github", "title": "elementalsouls/Claude-BugHunter", "summary": "A Claude Code skill bundle for bug hunting and external red-team work - 82 skills, 15 slash commands, 681 disclosed-report patterns curated irst loop transformer", "points": 888, "num_comments": 308, "url": "https://z.ai/blog/glm-5.4", "hn_url": "https://news.ycombinator.com/item?id=50609685", "created_at": "2026-11-23T10:06:43+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T10:06:43+00:00", "tags": []}, {"source": "hn", "title": "NariQ: BF16-level Qwen3.8-27B in a 10 GB file", "points": 36, "num_comments": 4, "url": "https://huggingface.co/nari-labs/Qwen3.8-27B-NariQ-GGUF", "hn_url": "https://news.ycombinator.com/item?id=50611402", "created_at": "2026-11-23T13:42:38+00:00", "story_text": "We built NariQ: 3-bit-or-lower quantizations of Qwen3.8-27B that retain near-BF16 quality across agentic tasks, math, multilingual reasoning, and image understanding.<p>To our knowledge, this is the first 3-bit-or-lower quantization that retains BF16 lvl performance on long-horizon agentic tasks.<p>Benchmarks (BF16 &#x2F; 3-bit &#x2F; 2.5-bit &#x2F; 2-bit):<p>- DeepSWE: 39.8 &#x2F; 41.0 &#x2F; 41.9 &#x2F; 28.6<p>- Terminal-Bench 2.1: 62.6 &#x2F; 63.8 &#x2F; 60.2 &#x2F; 52.4<p>- AIME 25+26: 97.7 &#x2F; 98.3 &#x2F; 96.5 &#x2F; 86.0<p>- MSGM: 94.0 &#x2F; 93.1 &#x2F; 91.8 &#x2F; 90.6<p>- RealWorldQA: 82.4 &#x2F; 82.4 &#x2F; 81.3 &#x2F; 80.9<p>Decode speed is comparable to other quants on an RTX PRO 6000. Context-length results below<p>(3-bit &#x2F; 2.5-bit &#x2F; 2-bit &#x2F; Unsloth UD-IQ3_XXS):<p>- 4K: 88.9 &#x2F; 99.2 &#x2F; 111.7 &#x2F; 94.7<p>- 16K: 84.5 &#x2F; 93.8 &#x2F; 105.1 &#x2F; 89.8<p>- 64K: 70.7 &#x2F; 77.5 &#x2F; 85.0 &#x2F; 74.8<p>Running these currently require our llama.cpp fork:\n(<a href=\"https:&#x2F;&#x2F;github.com&#x2F;nari-labs&#x2F;nari-llama.cpp\" rel=\"nofollow\">https:&#x2F;&#x2F;github.com&#x2F;nari-labs&#x2F;nari-llama.cpp<\/a>)<p>Feedback and questions welcome. We&#x27;d love to hear how these perform on your workloads.", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T13:42:38+00  243, "num_comments": 302, "url": "https://micjm.com/blog/yes-17m-lines-of-lean-is-a-lot/", "hn_url": "https://news.ycombinator.com/item?id=50607668", "created_at": "2026-11-23T05:00:49+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-23T05:00:49+00:00", "tags": []}], "papers": [{"source": "hf_papers", "title": "cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction", "summary": "Manifold-constrained Hyper-Connections (mHC) extends residual connections to multiple streams and stabilizes residual propagation by constraining stream-mixing residual matrices to the Birkhoff polytope, the set of doubly stochastic matrices. In this work, we investigate how to effectively mix residual streams within the Birkhoff polytope. We reveal a mixing trade-off: when under-mixed residual matrices stay close to the vertices of the Birkhoff polytope, hyper-connections will degenerate into a", "upvotes": 85, "num_comments": 2, "url": "https://huggingface.co/papers/2611.27193", "arxiv_id": "2611.27193", "published_at": "2026-11-20T00:00:00.000Z", "authors": ["Haowei He", "Ziwen Zhao", "Chenshuo Pan", "Gang Lin", "Zhihao Yang", "Chao Wang", "Xinzhang Liu", "Kaidong Yu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition in Robotic Manipulation", "summary": "Embodied intelligence aims to let robots perform complex physical tasks with human-like adaptability and reliability, which requires three complementary capabilities: history-based cognitive reasoning, precise and timely physical execution, and the composition of reasoning and execution through environmental feedback. Yet existing benchmarks either evaluate reasoning and execution within the same tasks or assess them separately without their composition, so they reveal little about whether a fai", "upvotes": 57, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26444", "arxiv_id": "2611.26444", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yuzhi Huang", "Jie Wu", "Fanding Huang", "Junchao Lin", "Weichen Zhang", "Ziyi Xiong", "Yang Li", "Zhengwei Xie"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection", "summary": "Recent advances in video generation call for reliable detection grounded in explicit forensic evidence. However, current methods primarily depend on single-pass chain-of-thought reasoning that overlooks brief or localized artifacts, or on predefined multi-agent workflows that offer limited flexibility in selecting relevant inspections. Even with adaptive investigation, optimizing the investigation policy alone does not directly improve the forensic capabilities of fixed experts. We introduce WeV", "upvotes": 55, "num_comments": 3, "url": "https://huggingface.co/papers/2611.21373", "arxiv_id": "2611.21373", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Yipeng Du", "Yuxi Li", "Ying Zhang", "Chong Sun", "Chen Li", "Jing Lyu", "Ying Tai"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Non-penetrating World Models", "summary": "We study a new problem of preventing object penetration in interactive video world models. To understand how existing models handle this, we introduce NoPeBench, a benchmark that evaluates how world models respond to physical obstacles. Our evaluation reveals that none of the open-source models can reliably prevent such failures. Surprisingly, however, these models already encode the information needed to predict such violations. We find that the hidden states of diffusion transformers (DiTs) ca", "upvotes": 54, "num_comments": 2, "url": "https://huggingface.co/papers/2611.27963", "arxiv_id": "2611.27963", "published_at": "2026-11-20T00:00:00.000Z", "authors": ["Yuhang Dai", "Yinwei Wu", "Ziyue Lin", "Han Ji", "Xingyi Yang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeMM-Video: Pushing the Frontiers of Open-Source Omni-Modal Video Understanding", "summary": "Video understanding, particularly with accompanying audio, remains a central challenge in multimodal intelligence. In this report, we introduce WeMM-Video, a family of Chinese-English bilingual omni-modal foundation models spanning 2B, 4B, 9B, and 35B-A3B variants. Centering on joint audio-visual perception and reasoning, WeMM-Video unifies text, image, audio, and video processing within a hybrid-thinking paradigm, seamlessly supporting both a non-thinking instruct mode for fast, direct response", "upvotes": 49, "num_comments": 3, "url": "https://huggingface.co/papers/2611.26409", "arxiv_id": "2611.26409", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Changli Tang", "Jie Yang", "Tianyi Wang", "Lei Li", "Daoze Zhang", "Zijie Xin", "Zhan Liu", "Li Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Posterior Matching Distillation", "summary": "Diffusion distillation accelerates image and video generation by compressing a pretrained teacher's iterative sampling process into a few network evaluations. Distribution-based methods achieve this by matching the student's output distribution to the teacher's. This matching is often driven by reverse-KL objectives, whose mode-seeking bias favors dominant teacher modes at the expense of diversity across samples. We introduce Posterior Matching Distillation (PMD), a new member of the distributio", "upvotes": 42, "num_comments": 4, "url": "https://huggingface.co/papers/2611.26629", "arxiv_id": "2611.26629", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Hidir Yesiltepe", "Julius Berner", "Arash Vahdat", "Pinar Yanardag"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Coda-DaVinci: Reimagining Video Generation with Code2Video", "summary": "Code2Video uses agent-authored 3D proxies to guide video gen ive that exploits local depth structure ", "upvotes": 35, "num_comments": 4, "url": "https://huggingface.co/papers/2611.21383", "arxiv_id": "2611.21383", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Jeonghwan Cho", "Minsu Kim", "Junyoung Hong", "Seon Joo Kim"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "EgoCaptioner: Towards Comprehensive and Fine-Grained Egocentric Video Captioning", "summary": "Egocentric video captioning requires fine-grained detail and accurate timing, yet current multimodal large language models (MLLMs) often miss brief actions, confuse their order, or misinterpret the wearer's motion. Existing caption formats also offer limited support for combining detailed narration with precise timing. We present EgoCaptioner, which pairs a video-level overview of the setting, participants, and the wearer's overall activity with timed steps whose narration adapts to varying perc", "upvotes": 26, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26380", "arxiv_id": "2611.26380", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Yuqi Tang", "Yang Shi", "Yuran Wang", "Tengfei Liu", "Rundong Wang", "Zongyang Qiu", "Qixun Wang", "Zhuoran Zhang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "HiUni: Harmonizing Understanding and Generation in Shared Visual Space", "summary": "Unified multimodal models aim to support visual understanding and generation within a single framework. However, prevailing approaches often separate their visual representations or backbone computation to accommodate the different requirements of these two tasks, which limits the degree of unification. In this paper, we present HiUni, which revisits this design choice and explores whether a pretrained vision language model can be directly extended into a unified model with extensive parameter s", "upvotes": 25, "num_comments": 2, "url": "https://huggingface.co/papers/2611.26107", "arxiv_id": "2611.26107", "publish
