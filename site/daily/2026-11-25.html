 "title": "Macrohistory in Six Facts", "points": 145, "num_comments": 78, "url": "https://basilhalperin.com/essays/macrohistory.html", "hn_url": "https://news.ycombinator.com/item?id=50637891", "created_at": "2026-11-25T03:04:46+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-25T03:04:46+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "Embo-Harness: Towards Understanding Frontier-Model-as-Policy Harness", "summary": "Frontier multimodal models exhibit extraordinary generalization in generating robot actions from observations and instructions, enabling a new paradigm in which they serve directly as policies within closed-loop robotic harnesses. However, the design principles of such harnesses, and the capabilities underlying their strong performance, remain unclear. We present Embo-Harness, a framework for systematically studying frontier-model-as-policy harnesses. We investigate four components of the roboti", "upvotes": 103, "num_comments": 2, "url": "https://huggingface.co/papers/2611.31201", "arxiv_id": "2611.31201", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Xiao-Ming Wu", "Kang Liao", "Yuexiao Ma", "Taolin Zhang", "Mingqian Zhou", "Nuo Chen", "Ziming Li", "Yihang Luo"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Antom 3-in-1 Transformer: A Payment Foundation Model", "summary": "We report the development of Antom 3-in-1 Transformer, a payment foundation model that integrates sequence, tabular, and graph representations for payment risk detection. The model contains approximately 7B parameters, with approximately 1.7B activated per task route. Antom 3-in-1 Transformer is pretrained to learn reusable behavioral and relational representations, primarily on Ant International's internal payment data. In a cross-business transfer experiment, pretraining improves the target bu", "upvotes": 99, "num_comments": 2, "url": "https://huggingface.co/papers/2611.25403", "arxiv_id": "2611.25403", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Weiyu Han", "Haoyu Jiang", "Jie Sheng", "Youxi Pan", "Xianglong Liu", "Zeqi Ren", "Dongquan Yi", "Yinhao Liu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe", "summary": "AI agents working on long tasks often commit to an answer before they have enough evidence, a behavior called laziness. In our evaluations, they frequently commit even while their stated belief still names several possible answers. An outcome reward at the end of the episode scores only the final answer, so it cannot teach the agent when to commit, because a lucky guess receives the same reward as an answer backed by evidence. During training, however, the simulator can compute the exact posteri", "upvotes": 87, "num_comments": 5, "url": "https://huggingface.co/papers/2611.32884", "arxiv_id": "2611.32884", "published_at": "2026-11-24T00:00:00.000Z", "authors": ["Richmond Sin Jing Xuan", "Peilin Feng", "Wenbin Wang", "Soujanya Poria"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Rewirable Circuits in Transformers with Loom Attention", "summary": "We propose loom attention, which allows a Transformer to dynamically rewire its circuits at every token by interweaving a head's vertical attention over the outputs of earlier heads (to obtain its query, key and value) with its horizontal attention over tokens. We instantiate vertical attention efficiently with normalized and gated linear attention over a per-token matrix memory, which stores the compressed head outputs and serves as a second residual stream. This yields LoomFormer, a dual-strea", "upvotes": 85, "num_comments": 2, "url": "https://huggingface.co/papers/2611.30634", "arxiv_id": "2611.30634", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Da Xiao", "Qingye Meng", "Shengping Li", "Xingyuan Yuan"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Don't Sleep, Keep Watch: Proactive Perception for Computer-Use Agents", "summary": "Computer-use agents (CUAs) built on vision-language models are increasingly entrusted with long-horizon tasks in live desktop, web, and mobile environments, where the screen keeps changing on its own. However, current CUAs lack real-time situational awareness: they perceive the environment through discrete snapshots, and the substantial inference latency of VLMs, compounded by highly dynamic interfaces, opens a perception-action gap in which the observed state frequently becomes stale before the", "upvotes": 84, "num_comments": 1, "url": "https://huggingface.co/papers/2611.28947", "arxiv_id": "2611.28947", "published_at": "2026-11-21T00:00:00.000Z", "authors": ["Jiaqi Su", "Jie-Jing Shao", "Yichen Liu", "Long-Kai Huang", "Haiyan Yin"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation", "summary": "Visual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while structured artifacts use explicit programs. A shared generation-and-rendering interface connects these representations to visual feedback across images, vector graphics, webpages, and documents. A Nemot", "upvotes": 77, "num_comments": 2, "url": "https://huggingface.co/papers/2611.31358", "arxiv_id": "2611.31358", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Guo Chen", "Fuxiao Liu", "Haoqin Tu", "Yiyang Zhou", "Andrew Tao", "Bryan Catanzaro", "Cihang Xie", "Yuyin Zhou"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ACAP: Asynchronous Coding Agents for Efficient Robot Control", "summary": "Coding agents can construct and revise robot behavior during execution, but using one agent for the whole robot can delay otherwise independent work. We introduce Asynchronous Coding Agents as Policy (ACAP), an asynchronous framework that organizes one robot as a team of persistent agents. Each member reasons and acts for a configurable control group, such as an arm with its gripper or the torso and chassis, enabling asynchronous reasoning and execution. However, different robot components often", "upvotes": 60, "num_comments": 2, "url": "https://huggingface.co/papers/2611.31205", "arxiv_id": "2611.31205", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Zexin He", "Rui Li", "Yushi Lan", "Chengkai Jin", "Zhi Hou", "Xingang Pan"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Let the Fixer Decide: Training a Code Localizer from the Fixer's Likelihood", "summary": "Code localizers are usually trained to predict the files a reference patch edits, but the code a fixer needs to read is not the same as the code it changes. We propose Fixer-Guided Localization (FGL): the localizer proposes several localizations, a frozen fixer scores each by how likely it makes a verified patch, and the localizer is trained on these scores with weighted supervised fine-tuning, without running tests and without reinforcement learning. We build the full pipeline on Gemma 4 E4B fo", "upvotes": 60, "num_comments": 4, "url": "https://huggingface.co/papers/2611.12164", "arxiv_id": "2611.12164", "published_at": "2026-11-09T00:00:00.000Z", "authors": ["Khalil Hennara", "Muhammad Hreden", "Zeina Aldallal", "Sara Chrouf", "Safwan AlModhayan"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "WeMM-Ecom: Advancing Multimodal Content Understanding for WeChat E-Commerce", "summary": "We present WeMM-Ecom, a family of multimodal large language models that deliver frontier e-commerce capabilities while achieving state-of-the-art general-purpose performance at their respective scales. The family spans five sizes, from a 0.8B dense model to a 35B mixture-of-experts model with 3B active parameters. Our training pipeline begins with two-stage continued pre-training that progressively raises the proportion of e-commerce data within a diverse multimodal data mixture, followed by hyb", "upvotes": 56, "num_comments": 1, "url": "https://huggingface.co/papers/2611.30662", "arxiv_id": "2611.30662", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Binhui Xie", "Jinmin Li", "Haomiao Tang", "Guangting Wang", "Song Jin", "Jianwei Zhu", "Fengyun Rao", "Jing Lyu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Self-Evolving Evaluation Environments for Computer-Use Agents", "summary": "Computer-use agents (CUAs) are rapidly improving, yet their evaluation remains largely static. Existing benchmarks provide a strong foundation, but fixed difficulty ceilings, limited feature coverage, and coarse aggregate scores progressively weaken their discriminative and diagnostic value. We introduce CUA-SEE, a closed-loop evaluation environment that co-evolves tasks and executable verifiers from rollout evidence. It disentangles three objectives: benchmark evolution expands evaluation scope", "upvotes": 45, "num_comments": 1, "url": "https://huggingface.co/papers/2611.30962", "arxiv_id": "2611.30962", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Wenhao Wang", "Panrong Tong", "Quyu Kong", "Pengxiang Li", "Haowen Yang", "chenglin Cai", "Siheng Chen", "Yue Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Innata-0: A Native Embodied World System with Model-Agent Co-Design", "summary": "The physical world is open-ended, dynamic, and partially observable. While foundation models have advanced embodied intelligence, standalone models struggle with long-horizon execution, and simply integrating models with agents may lead to inconsistencies between planning and physical control. To support reliable and adaptive behaviors in the physical world, we introduce Innata-0, a native embodied world system. Innata-0 jointly designs an embodied world-action model and an agent to combine thei", "upvotes": 42, "num_comments": 3, "url": "https://huggingface.co/papers/2611.30254", "arxiv_id": "2611.30254", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Innata Team", "Yu Bai", "Ziyi Bai", "Yuxuan Cai", "Chenrui He", "Wenhao Li", "Zhe Lin", "Heng Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ViDecide: Teaching Video Diffusion Models to Reason and Plan Step by Step", "summary": "Current leading video generation models can synthesize highly realistic videos, while still frequently violating physical and logical constraints in multi-step reasoning and planning, even after training with large-scale reasoning data or existing diffusion RL methods. We attribute these failures to the conventional video training paradigm, which treats a solution as a fixed-length clip rather than a chain of decisions. We present ViDecide, a decision-centric framework that trains video diffusio", "upvotes": 42, "num_comments": 3, "url": "https://huggingface.co/papers/2611.26389", "arxiv_id": "2611.26389", "published_at": "2026-11-19T00:00:00.000Z", "authors": ["Kaiwen Zhang", "Yiming Gao", "Zeqi Xiao", "Xintao Wang", "Pengfei Wan", "Kun Gai", "Xingang Pan"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "S-Mind: Internalizing Multi-View Geometry for Spatial Intelligence", "summary": "Spatial intelligence, the ability to reason about 3D space from visual observations, becomes essential as multimodal large language models (MLLMs) move into the physical world. Beyond perceiving each view, it rests on two cornerstones of human cognition: fusing multiple views into one coherent 3D scene and mentally transforming that scene to new viewpoints as reasoning unfolds. Yet our spatial probes reveal that MLLMs largely lack ary Bonsai 2.5 27B", "points": 515, "num_comments": 169, "url": "https://prismml.com/news/bonsai-2-5-27b", "hn_url": "https://news.ycombinator.com/item?id=50633922", "created_at": "2026-11-24T20:08:03+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-24T20:08:03+00:00", "tags": []}, {"source": "hn", "title": "Macrohistory in Six Facts", "points": 145, "num_comments": 78, "url": "https://basilhalperin.com/essays/macrohistory.html", "hn_url": "https://news.ycombinator.com/item?id=50637891", "created_at": "2026-11-25T03:04:46+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-25T03:04:46+00:00", "tags": []}], "papers": [{"source": "hf_papers", "title": "Embo-Harness: Towards Understanding Frontier-Model-as-Policy Harness", "summary": "Frontier multimodal models exhibit extraordinary generalization in generating robot actions from observations and instructions, enabling a new paradigm in which they serve directly as policies within closed-loop robotic harnesses. However, the design principles of such harnesses, and the capabilities underlying their strong performance, remain unclear. We present Embo-Harness, a framework for systematically studying frontier-model-as-policy harnesses. We investigate four components of the roboti", "upvotes": 103, "num_comments": 2, "url": "https://huggingface.co/papers/2611.31201", "arxiv_id": "2611.31201", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Xiao-Ming Wu", "Kang Liao", "Yuexiao Ma", "Taolin Zhang", "Mingqian Zhou", "Nuo Chen", "Ziming Li", "Yihang Luo"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Antom 3-in-1 Transformer: A Payment Foundation Model", "summary": "We report the development of Antom 3-in-1 Transformer, a payment foundation model that integrates sequence, tabular, and graph representations for payment risk detection. The model contains approximately 7B pa
