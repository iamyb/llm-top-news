hat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks", "summary": "We present Xing 4, a series of large language models that extends the TeleChat lineage through coordinated advances in model architecture and training infrastructure on Ascend. This report describes the design principles and systems engineering behind the series, spanning architecture selection, large-scale pretraining, and reasoning and agentic post-training. We study how sparse activation, attention design, model depth and width, and speculative decoding balance model capacity with computation", "upvotes": 147, "num_comments": 2, "url": "https://huggingface.co/papers/2611.22115", "arxiv_id": "2611.22115", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Xingchen AGI Lab", "Baotian Hu", "Bingkai Yang", "Boyang Wang", "Changzai Pan", "Chao Lyu", "Chao Wang", "Chen Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Sage S2.1 Flash Technical Report", "summary": "We introduce Sage S1.5 Flash, a 320-billion-parameter general-purpose mixture-of-experts model designed to reason over scientific evidence and act in interactive environments. Sage Sci-Perception uses dedicated encoders for molecular graphs and biological sequences and represents spectra as ordered patches of measurements. Modality-specific projectors map these representations into the input space of a shared backbone, which processes them alongside text and images. To develop the model's agent ", "upvotes": 95, "num_comments": 4, "url": "https://huggingface.co/papers/2611.21072", "arxiv_id": "2611.21072", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Kun Cai", "Haodong Chen", "Guangran Cheng", "Qingxiu Cheng", "Xu Dai", "Guanting Dong", "Qiming Ge", "Lixin Gu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "InclusionMed: Benchmarking AI for Inclusive Healthcare", "summary": "Advancing medical AI for inclusive healthcare requires evaluation across diverse healthcare roles, tasks, and care settings, but benchmark coverage remains uneven. We introduce InclusionMed, an open medical AI evaluation initiative for inclusive healthcare. The InclusionMed Atlas organizes benchmarks across three healthcare roles and three AI capabilities. For the first release, we selected four public benchmarks from 388 candidates through structured audits and independent reproduction. With In", "upvotes": 95, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21218", "arxiv_id": "2611.21218", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["The InclusionMed Collaboration"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "AscendGYM: A Cost-Aware Kernel Optimization Benchmark for Real-World Workloads on Ascend NPUs", "summary": "Kernel optimization is essential for efficient large language model (LLM) training and inference on Ascend NPUs. Existing Ascend kernel benchmarks primarily focus on kernel generation, with less emphasis on the ability of agents to optimize existing implementations under input configurations drawn from real workloads. To address this requirement, we introduce AscendGYM, a benchmark whose initial suite comprises 48 kernels across three difficulty levels. Each kernel is paired with test cases whos", "upvotes": 91, "num_comments": 2, "url": "https://huggingface.co/papers/2611.17621", "arxiv_id": "2611.17621", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["AI Training Platform Team", "Bingwei Zhang", "Jing Li", "Amir Abdullin", "Sihang Chen", "Xin Chen", "Liangjun Feng", "Yingmeng Gao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender", "summary": "Controllable real-world video generation models can condition on a rendered graybox proxy video, which fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender, yet no benchmark checks both these videos and the long, multi-shot scenes behind them. We introduce VibePrevisBench, a benchmark for 4D scene reconstruction: an agent turns a brief into an executable 4D scene and renders its proxy video. Its 242 tasks span four input kinds, including sc", "upvotes": 86, "num_comments": 3, "url": "https://huggingface.co/papers/2611.15789", "arxiv_id": "2611.15789", "published_at": "2026-11-11T00:00:00.000Z", "authors": ["Yuzhe Chen", "Muxi Diao", "Lele Yang", "Wenbin Xu", "Xuyang Liu", "Qile Su", "Changyi Liu", "Jiankang Chen"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "K2-Horizon: A Frontier Fleet of Open Source Language Models", "summary": "We present K2-Horizon, a fleet of six fully open language models, from a 0.9B dense model to a 375B-A23B MoE, built for general-purpose reasoning and agentic work across math and science, software engineering, deep research, office automation, and beyond. The models lead or are competitive with strong open models of their size on agentic and coding benchmarks. On the modeling side, to strengthen reasoning, we introduce Mixture-of-Value Attention (MoVA), applying MoE to attention value projection", "upvotes": 80, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21003", "arxiv_id": "2611.21003", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["K2 Team", "Zhengzhong Liu", "Haonan Li", "Xuezhe Ma", "Alexander Moreno", "Subham Sekhar Sahoo", "Rupesh Kumar Srivastava", "Mikhail Yurochkin"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data", "summary": "Real-world portfolio management requires converting noisy market observations into coordinated, simultaneous allocations across multiple assets under shared capital constraints. Advances in forecasting models and alpha discovery help identify opportunities. However, traditional pipelines often decouple signal forecasting from portfolio construction, potentially misaligning learning with allocation and execution objectives. We present AllocFlow, an end-to-end flow-matching framework that directly", "upvotes": 72, "num_comments": 4, "url": "https://huggingface.co/papers/2611.19937", "arxiv_id": "2611.19937", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Annan Wang", "Yuchen Xie", "Yu Cen", "Leon Liangyu Chen", "Qianyu Julie Zhu", "Xin Li", "Tianyi Wei", "Weisi Lin"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "MIRIX-2.0: Multi-Agent Memory System", "summary": "Long-term memory lets LLM agents personalize, stay consistent, and reuse what worked before. Parametric memories need training, consolidation can lose details for good, and keeping every record leaves a growing store to search. We present MIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and efficient at once. It is the most accurate of the compared systems on four of five QA benchmarks. It reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S, where it leads the strongest ", "upvotes": 53, "num_comments": 4, "url": "https://huggingface.co/papers/2611.12068", "arxiv_id": "2611.12068", "published_at": "2026-11-09T00:00:00.000Z", "authors": ["Wei-Chieh Huang", "Weizhi Zhang", "Jiayan Nan", "Peng Xia", "Yu Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations", "summary": "A coding agent working within a software organization must establish what to build, collaborate with colleagues, and verify what it delivers. We introduce SWE-CoWork, a benchmark comprising 101 development assignments across 101 real repositories, 11 programming languages, and 12 application domains. Each assignment places an agent in a simulated engineering organization with 26 colleagues who have distinct responsibilities, bounded knowledge, and controlled collaboration behavior. Starting from", "upvotes": 51, "num_comments": 4, "url": "https://huggingface.co/papers/2611.20218", "arxiv_id": "2611.20218", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Xinping Lei", "Minghao Liu", "Ruijie Zhu", "Xiaohui Hu", "Xingqiao Li", "Ao Zhang", "Wenhao Chai", "Han Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Weight-Space Programming Doesn't Need Transformers", "summary": "Standard neural architectures such as the Transformer were chosen because they train well with gradient descent and run fast on GPUs. In weight-space programming, a large language model (LLM) writes target weights by hand without gradient-based training, so those reasons no longer apply. Should we keep the Transformer? Given minimal guidance, ten labeled examples, and a sandbox, mainly on multiple-choice questions, we task three frontier LLMs with either generating the weights of a fixed archite", "upvotes": 42, "num_comments": 2, "url": "https://huggingface.co/papers/2611.22055", "arxiv_id": "2611.22055", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Hyunjong Ok", "Jaeho Lee"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "summary": "Tool-using agents act on email, files, and payments, so an instruction hidden in a web page or a shared document can make an agent send data or money to an attacker. Many runtime defenses put a language model on the decision that lets an action through, so the decision depends on a model that may read the attacker's text and adds model calls to every step. Provenance defenses keep the model off the final check but need a model to plan or route each task first. Where an action goes can instead be", "upvotes": 41, "num_comments": 2, "url": "https://huggingface.co/papers/2611.07222", "arxiv_id": "2611.07222", "published_at": "2026-11-04T00:00:00.000Z", "authors": ["Woosang Lim", "Yeseul Chang", "Jaewoo Lee"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Multi-Branch Transformer", "summary": "Transformer language models are commonly scaled by making their blocks wider or stacking them deeper. In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks. We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared final layers. At comparable training compute, we study three MB", "upvotes": 39, "num_comments": 2, "url": "https://huggingface.co/papers/2611.19800", "arxiv_id": "2611.19800", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Gaotang Li", "Lingjie Chen", "Chunyuan Deng", "Zhiwei Xu", "Hongzheng Chen", "Christopher De Sa", "Jingrui He", "Yingheng Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "MMFlash: Faster Speculative Decoding for Vision-Language Models", "summary": "Speculative decoding accelerates generation by letting a lightweight drafter propose tokens for parallel verification by a target model. Diffusion drafters such as DFlash propose an entire token block in a single forward pass, but mainly focus on text-only tasks, leaving multimodal drafting underexplored. To study this setting, we first introduce a metric of token-level visual dependence based on the KL divergence between next-token distributions with and without visual input. We find that accep", "upvotes": 39, "num_comments": 3, "url": "https://huggingface.co/papers/2611.18482", "arxiv_id": "2611.18482", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["Sicheng Feng", "Zigeng Chen", "Song Wang", "Gongfan Fang", "Xinchao Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models", "summary": "Frontier multimodal models can now control  "We present Xing 4, a series of large language models that extends the TeleChat lineage through coordinated advances in model architecture and training infrastructure on Ascend. This report describes the design principles and systems engineering behind the series, spanning architecture selection, large-scale pretraining, and reasoning and agentic post-training. We study how sparse activation, attention design, model depth and width, and speculative decoding balance model capacity with computation", "upvotes": 147, "num_comments": 2, "url": "https://huggingface.co/papers/2611.22115", "arxiv_id": "2611.22115", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Xingchen AGI Lab", "Baotian Hu", "Bingkai Yang", "Boyang Wang", "Changzai Pan", "Chao Lyu", "Chao Wang", "Chen Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Sage S2.1 Flash Technical Report", "summary": "We introduce Sage S1.5 Flash, a 320-billion-parameter general-purpose mixture-of-experts model designed to reason over scientific evidence and act in interactive environments. Sage Sci-Perception uses dedicated encoders for molecular graphs and biological sequences and represents spectra as ordered patches of measurements. Modality-specific projectors map these representations into the input space of a shared backbone, which processes them alongside text and images. To develop the model's agent ", "upvotes": 95, "num_comments": 4, "url": "https://huggingface.co/papers/2611.21072", "arxiv_id": "2611.21072", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Kun Cai", "Haodong Chen", "Guangran Cheng", "Qingxiu Cheng", "Xu Dai", "Guanting Dong", "Qiming Ge", "Lixin Gu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "InclusionMed: Benchmarking AI for Inclusive Healthcare", "summary": "Advancing medical AI for inclusive healthcare requires evaluation across diverse healthcare roles, tasks, and care settings, but benchmark coverage remains uneven. We introduce InclusionMed, an open medical AI evaluation initiative for inclusive healthcare. The InclusionMed Atlas organizes benchmarks across three healthcare roles and three AI capabilities. For the first release, we selected four public benchmarks from 388 candidates through structured audits and independent reproduction. With In", "upvotes": 95, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21218", "arxiv_id": "2611.21218", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["The InclusionMed Collaboration"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "AscendGYM: A Cost-Aware Kernel Optimization Benchmark for Real-World Workloads on Ascend NPUs", "summary": "Kernel optimization is essential for efficient large language model (LLM) training and inference on Ascend NPUs. Existing Ascend kernel benchmarks primarily focus on kernel generation, with less emphasis on the ability of agents to optimize existing implementations under input configurations drawn from real workloads. To address this requirement, we introduce AscendGYM, a benchmark whose initial suite comprises 48 kernels across three difficulty levels. Each kernel is paired with test cases whos", "upvotes": 91, "num_comments": 2, "url": "https://huggingface.co/papers/2611.17621", "arxiv_id": "2611.17621", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["AI Training Platform Team", "Bingwei Zhang", "Jing Li", "Amir Abdullin", "Sihang Chen", "Xin Chen", "Liangjun Feng", "Yingmeng Gao"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender", "summary": "Controllable real-world video generation models can condition on a rendered graybox proxy video, which fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender, yet no benchmark checks both these videos and the long, multi-shot scenes behind them. We introduce VibePrevisBench, a benchmark for 4D scene reconstruction: an agent turns a brief into an executable 4D scene and renders its proxy video. Its 242 tasks span four input kinds, including sc", "upvotes": 86, "num_comments": 3, "url": "https://huggingface.co/papers/2611.15789", "arxiv_id": "2611.15789", "published_at": "2026-11-11T00:00:00.000Z", "authors": ["Yuzhe Chen", "Muxi Diao", "Lele Yang", "Wenbin Xu", "Xuyang Liu", "Qile Su", "Changyi Liu", "Jiankang Chen"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "K2-Horizon: A Frontier Fleet of Open Source Language Models", "summary": "We present K2-Horizon, a fleet of six fully open language models, from a 0.9B dense model to a 375B-A23B MoE, built for general-purpose reasoning and agentic work across math and science, software engineering, deep research, office automation, and beyond. The models lead or are competitive with strong open models of their size on agentic and coding benchmarks. On the modeling side, to strengthen reasoning, we introduce Mixture-of-Value Attention (MoVA), applying MoE to attention value projection", "upvotes": 80, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21003", "arxiv_id": "2611.21003", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["K2 Team", "Zhengzhong Liu", "Haonan Li", "Xuezhe Ma", "Alexander Moreno", "Subham Sekhar Sahoo", "Rupesh Kumar Srivastava", "Mikhail Yurochkin"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data", "summary": "Real-world portfolio management requires converting noisy market observations into coordinated, simultaneous allocations across multiple assets under shared capital constraints. Advances in forecasting models and alpha discovery help identify opportunities. However, traditional pipelines often decouple signal forecasting from portfolio construction, potentially misaligning learning with allocation and execution objectives. We present AllocFlow, an end-to-end flow-matching framework that directly", "upvotes": 72, "num_comments": 4, "url": "https://huggingface.co/papers/2611.19937", "arxiv_id": "2611.19937", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Annan Wang", "Yuchen Xie", "Yu Cen", "Leon Liangyu Chen", "Qianyu Julie Zhu", "Xin Li", "Tianyi Wei", "Weisi Lin"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "MIRIX-2.0: Multi-Agent Memory System", "summary": "Long-term memory lets LLM agents personalize, stay consistent, and reuse what worked before. Parametric memories need training, consolidation can lose details for good, and keeping every record leaves a growing store to search. We present MIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and efficient at once. It is the most accurate of the compared systems on four of five QA benchmarks. It reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S, where it leads the strongest ", "upvotes": 53, "num_comments": 4, "url": "https://huggingface.co/papers/2611.12068", "arxiv_id": "2611.12068", "published_at": "2026-11-09T00:00:00.000Z", "authors": ["Wei-Chieh Huang", "Weizhi Zhang", "Jiayan Nan", "Peng Xia", "Yu Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations", "summary": "A coding agent working within a software organization must establish what to build, collaborate with colleagues, and verify what it delivers. We introduce SWE-CoWork, a benchmark comprising 101 development assignments across 101 real repositories, 11 programming languages, and 12 application domains. Each assignment places an agent in a simulated engineering organization with 26 colleagues who have distinct responsibilities, bounded knowledge, and controlled collaboration behavior. Starting from", "upvotes": 51, "num_comments": 4, "url": "https://huggingface.co/papers/2611.20218", "arxiv_id": "2611.20218", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Xinping Lei", "Minghao Liu", "Ruijie Zhu", "Xiaohui Hu", "Xingqiao Li", "Ao Zhang", "Wenhao Chai", "Han Li"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Weight-Space Programming Doesn't Need Transformers", "summary": "Standard neural architectures such as the Transformer were chosen because they train well with gradient descent and run fast on GPUs. In weight-space programming, a large language model (LLM) writes target weights by hand without gradient-based training, so those reasons no longer apply. Should we keep the Transformer? Given minimal guidance, ten labeled examples, and a sandbox, mainly on multiple-choice questions, we task three frontier LLMs with either generating the weights of a fixed archite", "upvotes": 42, "num_comments": 2, "url": "https://huggingface.co/papers/2611.22055", "arxiv_id": "2611.22055", "published_at": "2026-11-17T00:00:00.000Z", "authors": ["Hyunjong Ok", "Jaeho Lee"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "SPILLWAY: Separating Target Admission from Sanitization to Defend Tool-Using Agents against Prompt Injection", "summary": "Tool-using agents act on email, files, and payments, so an instruction hidden in a web page or a shared document can make an agent send data or money to an attacker. Many runtime defenses put a language model on the decision that lets an action through, so the decision depends on a model that may read the attacker's text and adds model calls to every step. Provenance defenses keep the model off the final check but need a model to plan or route each task first. Where an action goes can instead be", "upvotes": 41, "num_comments": 2, "url": "https://huggingface.co/papers/2611.07222", "arxiv_id": "2611.07222", "published_at": "2026-11-04T00:00:00.000Z", "authors": ["Woosang Lim", "Yeseul Chang", "Jaewoo Lee"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Multi-Branch Transformer", "summary": "Transformer language models are commonly scaled by making their blocks wider or stacking them deeper. In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks. We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared final layers. At comparable training compute, we study three MB", "upvotes": 39, "num_comments": 2, "url": "https://huggingface.co/papers/2611.19800", "arxiv_id": "2611.19800", "published_at": "2026-11-15T00:00:00.000Z", "authors": ["Gaotang Li", "Lingjie Chen", "Chunyuan Deng", "Zhiwei Xu", "Hongzheng Chen", "Christopher De Sa", "Jingrui He", "Yingheng Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "MMFlash: Faster Speculative Decoding for Vision-Language Models", "summary": "Speculative decoding accelerates generation by letting a lightweight drafter propose tokens for parallel verification by a target model. Diffusion drafters such as DFlash propose an entire token block in a single forward pass, but mainly focus on text-only tasks, leaving multimodal drafting underexplored. To study this setting, we first introduce a metric of token-level visual dependence based on the KL divergence between next-token distributions with and without visual input. We find that accep", "upvotes": 39, "num_comments": 3, "url": "https://huggingface.co/papers/2611.18482", "arxiv_id": "2611.18482", "published_at": "2026-11-13T00:00:00.000Z", "authors": ["Sicheng Feng", "Zigeng Chen", "Song Wang", "Gongfan Fang", "Xinchao Wang"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models", "summary": "Frontier multimodal models can now control robots zero-shot from images, yet many manipulation tasks depend on contact forces that images cannot show. Bringing force to an API-only frozen model raises two challenges. First, contact evolves much faster than an API model can decide, so the system must close the loop on force beneath the model. Second, a frozen model cannot interpret raw force streams, so force must be returned in a form the model can reason about. Therefore, we present ForceHarnes", "upvotes": 38, "num_comments": 2, "url": "https://huggingface.co/papers/2611.21099", "arxiv_id": "2611.21099", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Ke Sun", "Kevin Yuchen Ma", "Yike Zhang", "Yanzhe Chen", "Mike Zheng Shou"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters", "summary": "Frontier Vision-Language Models (VLMs) such as GPT-6 Astra have demonstrated remarkable capabilities in robot control, suggesting that broad pretraining provides knowledge valuable for physical action. Yet most Vision-Language-Action (VLA) policies still rely on much smaller VLM backbones, leaving this potential largely untapped. We ask whether frontier-scale representations can provide a stronger foundation for robot learning. We introduce ScaleVLA, which connects a 552B DeepSeek-V4.1-Flash bac", "upvotes": 36, "num_comments": 1, "url": "https://huggingface.co/papers/2611.21607", "arxiv_id": "2611.21607", "published_at": "2026-11-16T00:00:00.000Z", "authors": ["Ruixi Yu", "Dairu Liu", "Xuchuan Chen", "Zekun Qi", "Zekai Li", "Zhuo Cao", "Luyang Niu", "Yingsheng Zhang"], "section": "papers", "tags": []}], "applications": []}, "section_meta": [{"key": "github", "label": "GitHub", "sources": ["github_trending", "github_new"]}, {"key": "community", "label": "Community Pulse", "sources": ["reddit", "hn"]}, {"key": "papers", "label": "Papers", "sources": ["hf_papers"]}, {"key": "applications", "label": "LLM Applications", "sources": []}], "cross": []}}</script>
