matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-25T19:11:27+00:00", "tags": []}, {"source": "hn", "title": "Minipg: PostgreSQL as a Single Executable", "points": 253, "num_comments": 38, "url": "https://progrium.github.io/minipg/", "hn_url": "https://news.ycombinator.com/item?id=50650892", "created_at": "2026-11-26T03:00:48+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-26T03:00:48+00:00", "tags": []}, {"source": "hn", "title": "Collection of preserved UI style guides", "points": 348, "num_comments": 67, "url": "https://aresluna.org/ui-style-guides/", "hn_url": "https://news.ycombinator.com/item?id=50649834", "created_at": "2026-11-26T00:40:00+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-26T00:40:00+00:00", "tags": []}, {"source": "hn", "title": "Ask HN: Any courses/products by indie makers worth getting today?", "points": 33, "num_comments": 10, "url": "https://news.ycombinator.com/item?id=50656763", "hn_url": "https://news.ycombinator.com/item?id=50656763", "created_at": "2026-11-26T16:16:41+00:00", "story_text": "Though I am not a JS dev, I got threejs-journey (no affiliation with the creator) last year on a whim, enjoyed it.<p>Any courses&#x2F;products&#x2F;books etc that you recommend, specifically from Indie makers? Not interested in big promotions like Udemy, Datacamp etc", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-26T16:16:41+00:00", "tags": []}, {"source": "hn", "title": "Slow Ubuntu security response times", "points": 388, "num_comments": 226, "url": "https://www.openwall.com/lists/oss-security/2026/11/25/9", "hn_url": "https://news.ycombinator.com/item?id=50647181", "created_at": "2026-11-25T20:38:00+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-25T20:38:00+00:00", "tags": []}, {"source": "hn", "title": "Tell HN: Lots of Ask HNs again", "points": 367, "num_comments": 146, "url": "https://news.ycombinator.com/item?id=50649864", "hn_url": "https://news.ycombinator.com/item?id=50649864", "created_at": "2026-11-26T00:43:34+00:00", "story_text": "There have been questions about why the &#x2F;ask page (<a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;ask\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;ask<\/a>) was running dry of Ask HNs - e.g.:<p><i>Ask HN: Why is Ask HN only showing me 14 posts?<\/i> - <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49984484\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=49984484<\/a> - Oct 2026 (47 comments)<p><i>Ask HN: Why is pagination gone on &quot;Ask HN&quot;, and showing only 19 items?<\/i> - <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50280719\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50280719<\/a> - Oct 2026 (3 comments)<p>I believe I found the problem. The pool of stories for <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;ask\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;ask<\/a> has traditionally been drawn from the ranked stories list from which we generate the frontpage. That list is restricted to the top 1500 ranked submissions, and it seems the % of submissions which are text posts (i.e. no linked URL) had declined enough to starve the Ask HN feed. The solution is to compute a separate list of ranked Ask HNs.<p>p.s. &quot;Ask HN&quot; is the conventional name but it means text posts. The title can also start with &quot;Tell HN&quot; or nothing in particular. They&#x27;re just posts which were submitted without a URL.", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-26T00:43:34+00:00", "tags": []}, {"source": "hn", "title": "An algebraic quantization of gravity from the null cone", "points": 147, "num_comments": 42, "url": "https://arxiv.org/abs/2611.34924", "hn_url": "https://news.ycombinator.com/item?id=50651863", "created_at": "2026-11-26T05:37:51+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-26T05:37:51+00:00", "tags": []}, {"source": "hn", "title": "Unconditional Integer Factorization in Subexponential Time", "points": 125, "num_comments": 16, "url": "https://github.com/google-research/google-research/tree/4a7bc8ab0bc770e71a259b7966c500496b99010a/cogentic_research_papers/integer_factorization", "hn_url": "https://news.ycombinator.com/item?id=50651627", "created_at": "2026-11-26T04:59:56+00:00", "story_text": "", "matched_keywords": [], "section": "community", "summary": "", "published_at": "2026-11-26T04:59:56+00:00", "tags": []}], "hf_papers": [{"source": "hf_papers", "title": "Real2SimLab: A Unified Platform for Real-to-Simulation Transfer", "summary": "Real-to-simulation transfer, which builds simulations from real-world observations, has long been studied in research and industry. Recently, coding agents have become capable of generating simulation programs from video recordings, and several benchmarks have been proposed to evaluate them. However, each individual benchmark defines its own inputs, deliverables, and scoring pipeline. This leads to N times M integrations when evaluating N methods on M benchmarks. To this end, we present Real2Sim", "upvotes": 101, "num_comments": 2, "url": "https://huggingface.co/papers/2611.34849", "arxiv_id": "2611.34849", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Yongchang Zhang", "Jie Huang", "Yunhe Ni", "Ningyu Zhou", "Guangyu Zhao", "Ruixun Liu", "Rui Huang", "Yidi Wu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe", "summary": "AI agents working on long tasks often commit to an answer before they have enough evidence, a behavior called laziness. In our evaluations, they frequently commit even while their stated belief still names several possible answers. An outcome reward at the end of the episode scores only the final answer, so it cannot teach the agent when to commit, because a lucky guess receives the same reward as an answer backed by evidence. During training, however, the simulator can compute the exact posteri", "upvotes": 98, "num_comments": 10, "url": "https://huggingface.co/papers/2611.32884", "arxiv_id": "2611.32884", "published_at": "2026-11-24T00:00:00.000Z", "authors": ["Richmond Sin Jing Xuan", "Peilin Feng", "Wenbin Wang", "Soujanya Poria"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Sage-Med: Scaling Medical Multimodal Intelligence", "summary": "Establishing effective scaling laws for medical multimodal large language models (MLLMs) remains a persistent and fundamental challenge. Our systematic evaluation shows that existing medical MLLMs tend to underperform frontier general-purpose MLLMs across a range of medical tasks, while scaling model size primarily improves text capabilities rather than multimodal perception, and enabling reasoning modes fails to close this visual gap. To investigate how medical multimodal intelligence scales in", "upvotes": 82, "num_comments": 1, "url": "https://huggingface.co/papers/2611.34575", "arxiv_id": "2611.34575", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Med Team", "Ming Hu", "Cheng Tang", "Wei Li", "Rongbin Li", "Feilong Tang", "Junru Hu", "Hongze Zhu"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Nemotron-Labs-VisualCreation: Pixel as Code for Agentic Visual Creation", "summary": "Visual creation demands expressive imagery together with precise control over text, layout, and structure. We introduce Nemotron-Labs-VisualCreation, an agentic framework that connects these capabilities through Pixel as Code. Raster images are represented by learned discrete visual tokens, while structured artifacts use explicit programs. A shared generation-and-rendering interface connects these representations to visual feedback across images, vector graphics, webpages, and documents. A Nemot", "upvotes": 82, "num_comments": 3, "url": "https://huggingface.co/papers/2611.31358", "arxiv_id": "2611.31358", "published_at": "2026-11-23T00:00:00.000Z", "authors": ["Guo Chen", "Fuxiao Liu", "Haoqin Tu", "Yiyang Zhou", "Andrew Tao", "Bryan Catanzaro", "Cihang Xie", "Yuyin Zhou"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "Mixture-of-Loops Transformer", "summary": "Looped Transformers boost expressivity by reusing shared layers across loops, yet at the cost of efficiency. Pushing their expressivity-efficiency frontier requires rethinking the core mechanism connecting adjacent loops: What should be passed as a Transformer loops? We introduce Mixture-of-Loops Transformer (MoLT), whose Mixture-of-Loops Attention (MoLA) uses keys and values (KV) as memory for selective reuse across depths and loops. Under loop residual, MoLT-R retains the residual stream and r", "upvotes": 57, "num_comments": 1, "url": "https://huggingface.co/papers/2611.34923", "arxiv_id": "2611.34923", "published_at": "2026-11-25T00:00:00.000Z", "authors": ["Lianghui Zhu", "Shijie Wang", "Xinggang Wang", "Jinze Bai", "Bo Wang", "Xiang Bai"], "section": "papers", "tags": []}, {"source": "hf_papers", "title": "VibeVideoAgent: Closing the Perceptual Loop for Code-Driven Video Generation", "summary": "Code-driven video generation asks a coding agent to write and run rendering programs. This gives exact control over typography, data visualizations, synchronized audio, and multi-shot scenes, and it leaves an editable project behind. A program that exits cleanly can still render overlapping labels, a camera aimed away from its subject, broken object interactions, or narration that drifts out of sync, and none of these raise a runtime error. Feeding rendered frames and audio back into the coding ", "upvotes": 54, "num_co
